  - name: Pull requests
    url: https://github.com/digitalprezllc/netblueprint-forge/blob/develop/CONTRIBUTING.md
    about: Not accepted, and closed on arrival; CONTRIBUTING.md says why. Describe the problem in a bug report instead.

/* svg: zones, appliances, nodes */
.zone .zbox{fill:color-mix(in srgb,var(--zc,#1F5FFF) 4%,#fff);stroke:var(--zc,#1F5FFF);stroke-opacity:.55;stroke-width:1.4}
.zone.dashed .zbox{stroke-dasharray:6 5}
.zone.oos .zbox{stroke-dasharray:3 4;fill:#fafbfc}
.zone .zlabel{fill:var(--zc,#1F5FFF);font:700 12px var(--sans);cursor:pointer}.zone .zsub{fill:var(--ink-3);font:11px var(--sans)}
.zone .ic{fill:none;stroke:var(--zc);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.zone.focus .zbox{stroke-width:2.4;stroke-opacity:1;filter:drop-shadow(0 4px 12px color-mix(in srgb,var(--zc) 45%,transparent))}
.seam{stroke:var(--rule-2);stroke-width:1.5;stroke-dasharray:2 6}
.seam-label{fill:var(--ink-3);font:600 12px var(--sans);letter-spacing:.04em;text-transform:uppercase}
.node,.app{cursor:pointer}
.node .box,.app .box{fill:var(--white);stroke:var(--nc,#B9C4D4);stroke-width:1.6;transition:stroke .25s,fill .25s}
.node:hover .box,.app:hover .box{stroke:var(--ink-2)}
.node.active .box,.app.active .box{stroke:var(--nc,#1F5FFF);stroke-width:2.6;fill:color-mix(in srgb,var(--nc,#1F5FFF) 8%,#fff)}
/* selection: a soft shadow in the element's own colour plus a firmer stroke */
.node.focus .box,.app.focus .box{stroke:var(--nc);stroke-width:2.4;filter:drop-shadow(0 3px 7px color-mix(in srgb,var(--nc) 60%,transparent))}
.comp.focus rect.cbox{stroke:var(--nc);stroke-opacity:1;stroke-width:1.8;filter:drop-shadow(0 2px 5px color-mix(in srgb,var(--nc) 55%,transparent))}
.node.oos .box,.app.oos .box{stroke-dasharray:4 4;opacity:.75}.node.oos text,.app.oos text,.comp.oos text{fill:var(--ink-3)}.node.oos .ic,.app.oos .ic,.comp.oos .ic{stroke:var(--grey)}.node.oos .accent,.app.oos .accent{fill:var(--grey)}
.comp.oos rect.cbox{stroke-dasharray:3 3;opacity:.7}
.flow.oos .line{opacity:.4}.flow.oos .fl{opacity:.5}
.flow.plain .line{stroke-dasharray:2 4}
.node.suggested .box,.app.suggested .box,.zone.suggested .zbox{stroke-dasharray:2 3}
.node .box.stack{fill:#F4F7FB;stroke:var(--nc);stroke-opacity:.5}
.node .t,.app .t{fill:var(--ink);font:600 12px var(--sans)}.node .s,.app .s{fill:var(--ink-3);font:11px var(--sans)}
.node .accent,.app .accent{fill:var(--nc,#1F5FFF)}
.node .ic,.app .ic,.comp .ic{fill:none;stroke:var(--nc,#1F5FFF);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.node.hostile .ic{stroke:var(--block)}
.vic use{pointer-events:none}.node.oos .vic,.app.oos .vic,.comp.oos .vic,.zone.oos .vic{opacity:.45;filter:grayscale(1)}.node.hostile .accent{fill:var(--block)}
.node .ring{fill:none;stroke:var(--nc);stroke-width:2.4;opacity:0;transform-box:fill-box;transform-origin:center;pointer-events:none}
.node.pulse .ring{animation:ring 1.2s ease-out infinite}
@keyframes ring{0%{opacity:.75;transform:scale(1)}100%{opacity:0;transform:scale(1.08)}}
.comp rect.cbox{fill:#F7F9FC;stroke:var(--nc);stroke-opacity:.35;stroke-width:1.2}
.comp.active rect.cbox{stroke-opacity:1;stroke-width:2;fill:color-mix(in srgb,var(--nc) 10%,#fff)}
.comp .t{fill:var(--ink);font:600 11px var(--sans)}.comp .p{fill:var(--ink-3);font:10px var(--mono)}
.app .t{font-size:11.5px}
.tag-sugg{fill:var(--warn);font:700 9px var(--mono);letter-spacing:.06em}
.cls-tag{fill:var(--ink-3);font:700 8.5px var(--mono);letter-spacing:.06em}
/* flows */
.flow .line{fill:none;stroke:var(--fc,#B9C4D4);stroke-width:2;transition:stroke .3s,stroke-width .3s}
.flow .hit{fill:none;stroke:transparent;stroke-width:14;cursor:pointer}
.flow.lit .line{stroke-width:3}
.flow.tunnel .line{stroke:var(--k-tunnel);stroke-width:4;stroke-dasharray:9 6;animation:flow .9s linear infinite}
.flow.kind-blocked .line{stroke-dasharray:6 5}
.flow.kind-trust .line{stroke-dasharray:2 6;stroke-width:1.5}
.flow.kind-dependency .line{stroke-dasharray:3 5;stroke-width:1.4}
.flow.strength-weak .line,.flow.strength-none .line{stroke-dasharray:7 4}
.flow.lit-block .line{stroke:var(--block);stroke-width:2.6}
.flow.focus .line{stroke-width:3.4;filter:drop-shadow(0 2px 4px color-mix(in srgb,var(--fc) 70%,transparent))}
.flow.step .line{stroke-width:2.8}
.flow .fl{fill:var(--ink-3);font:600 10px var(--sans);paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round}
.cancel-bg{fill:var(--block);stroke:#fff;stroke-width:2}
.cancel-x{fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round}
@keyframes flow{to{stroke-dashoffset:-15}}
.ab circle.bg{fill:#fff;stroke:var(--ac);stroke-width:2}
.ab text{fill:var(--ac);font:800 10px var(--mono);text-anchor:middle;dominant-baseline:central}
.ab path{fill:none;stroke:var(--ac);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ab{cursor:help}
.packet .halo{opacity:.25}
.packet-control circle{fill:var(--k-control)}.packet-auth circle{fill:var(--k-auth)}.packet-token circle{fill:var(--k-token)}.packet-blocked circle{fill:var(--block)}.packet-data circle{fill:var(--k-data)}
.badge circle{stroke:#fff;stroke-width:2;fill:var(--pass)}.badge path{fill:none;stroke:#fff;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.badge{animation:fade .3s ease-out}@keyframes fade{from{opacity:0}to{opacity:1}}
/* threat markers */
.tm{cursor:pointer}
.tm circle.core{stroke:#fff;stroke-width:2}
.tm circle.pat{fill:none;stroke-width:1.6}
.tm text{font:800 11px var(--mono);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.tm.active circle.core,.tm.step circle.core{stroke:var(--ink);stroke-width:2.5}
.tm.step{filter:drop-shadow(0 0 4px rgba(20,33,61,.5))}
.tm.dim{opacity:.35}
/* attack paths: a red phase per path, numbered hop markers on the canvas, chips in the band, the register and the attributes card */
.phases li.attack{color:#8A1C14;border-color:#F3B4AE}.phases li.attack b{background:#FBE9E7;border-color:#F3B4AE;color:#8A1C14}
.phases li.attack.cur{background:#FBE9E7;border-color:var(--block);color:#8A1C14}.phases li.attack.cur b,.phases li.attack.done b{background:var(--block);border-color:var(--block);color:#fff}
.flow.chain .line{stroke:var(--block);stroke-width:2.6}
.hop circle{fill:var(--block);stroke:#fff;stroke-width:2}.hop text{fill:#fff;font:700 11px var(--mono);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.hop.cur circle{stroke:var(--ink);stroke-width:2.5}.hop.cur{filter:drop-shadow(0 0 4px rgba(209,53,44,.6))}.hop.done circle{fill:#8A1C14}.hop{cursor:pointer;outline:none}
.gainchip{display:inline-flex;align-items:center;gap:6px;border:1px solid #F3B4AE;border-radius:999px;padding:2px 9px;font-size:11px;color:#8A1C14;background:#FBE9E7;font-weight:700}
.pchip{display:inline-flex;align-items:center;gap:6px;border:1px solid #F3B4AE;border-radius:999px;padding:2px 9px 2px 3px;font-size:11px;cursor:pointer;background:#fff;color:var(--ink-2)}.pchip:hover{border-color:var(--block)}
.pchip i{display:grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--block);color:#fff;font:700 10px var(--mono);font-style:normal}
ol.hops{margin:0;padding:0;list-style:none}ol.hops li{margin:4px 0;line-height:1.5}ol.hops li .desc{margin-left:0}
.tabs button i.wi{font-style:normal;font:700 9px var(--mono);letter-spacing:.06em;color:#B45309;border:1px solid #F0C27A;border-radius:3px;padding:0 4px;margin-right:6px;background:#FFF7E6;vertical-align:1px}
.regpage h3.rsec{margin:18px 16px 6px;font:700 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.whatif{display:flex;align-items:center;gap:10px;margin:6px 0 4px;padding:6px 10px;border:1px solid #F0C27A;border-left:4px solid #B45309;border-radius:6px;background:#FFF7E6;font-size:11.5px;color:var(--ink-2)}
.whatif b{color:#B45309;font:700 10px var(--mono);letter-spacing:.06em;white-space:nowrap}.whatif a{color:var(--brand);cursor:pointer;text-decoration:underline;white-space:nowrap;margin-left:auto}
.tm .tchk path.sh{fill:var(--pass);stroke:#fff;stroke-width:1.4;stroke-linejoin:round}.tm .tchk path.chk{fill:none;stroke:#fff;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tip .st{display:inline-block;font-weight:700;border-radius:4px;padding:0 6px;line-height:1.5;margin:2px 0}
.tip .st-open{color:#5a3e00;background:#FFF1C2;border:1px solid #E0A100}
.tip .st-mitigated{color:#fff;background:var(--pass)}
.tip .st-in-progress{color:#fff;background:var(--brand)}
.tip .st-accepted,.tip .st-transferred{color:var(--ink);background:var(--paper);border:1px solid var(--rule-2)}
.tip .st-retired,.tip .st-false-positive,.tip .st-duplicate{color:var(--ink-3);background:var(--paper);border:1px solid var(--rule);text-decoration:line-through}
.tip .ok{color:var(--pass);font-weight:700}
.cb{cursor:help}.cb path{fill:var(--pass);stroke:var(--pass);stroke-width:1.2;stroke-linejoin:round}.cb path.chk{fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round}
@media(prefers-reduced-motion:reduce){.flow.tunnel .line,.node.pulse .ring,.badge{animation:none}.flow.tunnel .line{stroke-dasharray:none}}

<script id="nb-model" type="application/json">{"$schema":"../../skills/netblueprint-forge/assets/schema/netblueprint.schema.json","netblueprint":"1","meta":{"title":"AnyCompany Web Application on AWS: Three-Tier Architecture in a VPC","subtitle":"Reference Architecture","description":"Customers reach a web application through CloudFront with AWS WAF, an Application Load Balancer in public subnets and EC2 instances in an Auto Scaling group in private subnets. The application talks to Amazon RDS in isolated subnets and to Secrets Manager and S3 over VPC endpoints; operators administer the instances through Systems Manager Session Manager with no inbound SSH. Adapted from the AWS Architecture Center's web application hosting reference architecture, set at AWS's sample organization AnyCompany.","author":"DigitalPrez, LLC","organization":"AnyCompany","date":"2026-11-01","version":"1.0.0","revision_note":"First version. Renderer 1.8.0.","document_classification":"internal","document_id":"NBF-EX-0004","status":"draft","objective":"Serve one public web application from private subnets, with every data store and secret reachable only from the application tier and every administrative path brokered by Session Manager.","flow_summary":"Customer to the web tier; API to RDS, Secrets Manager and S3; operator to Session Manager","path_summary":["Customer","CloudFront + WAF","ALB","EC2","RDS"],"access_summary":"Customers: Cognito with MFA (OIDC). Operators: IAM Identity Center with a FIDO2 key and Session Manager. Services: IAM roles, no stored keys.","assumptions":["One production account under AWS Organizations with service control policies applied","Two Availability Zones; the Auto Scaling group spans both","Secrets Manager rotates the database password; the application reads it at start"],"out_of_scope":["The CI/CD pipeline that builds AMIs and deploys","The data warehouse that reads RDS snapshots"],"tags":["aws","three-tier","vpc","reference-architecture"]},"settings":{"network_label":"AnyCompany: AWS Production Account","internet_label":"Internet","layout":{"min_width":1280,"min_height":640,"flow_direction":"left-to-right"},"show":{"threats":true,"threat_register":true,"layer_panel":true,"signature_block":true,"legend":true}},"auth_types":[{"id":"cognito-oidc","label":"Cognito + MFA (OIDC)","strength":"strong","description":"Customer sign-in through an Amazon Cognito user pool with MFA; the application receives OIDC tokens."},{"id":"origin-secret","label":"CloudFront Origin Secret Header","strength":"moderate","description":"A custom header with a secret value that the ALB listener rule requires; identifies CloudFront as the caller."},{"id":"tg-none","label":"Target Group · No Client Auth","strength":"none","description":"The load balancer forwards to targets without client authentication; the security group admits only the load balancer."},{"id":"iam-role","label":"IAM Role (SigV4)","strength":"strong","description":"The instance's IAM role signs AWS API calls; no stored keys."},{"id":"iam-db-auth","label":"RDS IAM Authentication + TLS","strength":"strong","description":"Short-lived IAM database tokens over TLS; no database password in the application."},{"id":"oac","label":"CloudFront Origin Access Control","strength":"strong","description":"CloudFront signs S3 requests with SigV4; the bucket policy admits only this distribution."},{"id":"sso-fido2","label":"IAM Identity Center + FIDO2","strength":"strong","phishing_resistant":true,"description":"Operator sign-in with a security key; permission sets grant time-bound access."},{"id":"ssm-session","label":"Session Manager (IAM)","strength":"strong","description":"Sessions authorised by IAM through Identity Center permission sets and logged to CloudWatch; no inbound port."},{"id":"anonymous","label":"Anonymous","strength":"none"}],"layers":[{"name":"illustrative-threats","label":"Illustrative Threats","description":"Example threats and controls. Hide to see the plain design.","visible":true}],"zones":[{"name":"aws-account","label":"AWS Account: Production","sub":"us-east-1 · Organizations · SCPs","kind":"cloud","color":"teal","icon":"aws/group-aws-account","layout":{"order":0,"arrange":"column"},"info":"One production account under AWS Organizations; service control policies deny public S3 ACLs, IMDSv1 launches and region use outside us-east-1."},{"name":"vpc-prod","label":"Production VPC","sub":"10.40.0.0/16 · 2 AZs · Flow Logs","parent":"aws-account","kind":"vpc","color":"blue","icon":"aws/group-virtual-private-cloud-vpc","layout":{"row":0,"arrange":"row"},"info":"Three subnet tiers in two Availability Zones. Flow logs go to CloudWatch; GuardDuty analyses them."},{"name":"snet-public","label":"Public Subnets","sub":"10.40.0.0/24 · 10.40.1.0/24 · ALB, NAT","parent":"vpc-prod","kind":"subnet","icon":"aws/group-public-subnet","layout":{"order":0,"arrange":"column"},"appliances":[{"name":"nacl-public","label":"NACL","sub":"443 In · Ephemeral Out","type":"firewall","edge":"left","filters":"both","serves":["internet"],"icon":"aws/vpc-network-access-control-list","info":"Network ACL on the public subnets: inbound 443 from anywhere, ephemeral ports outbound; everything else denied."}]},{"name":"snet-app","label":"Private Subnets: Application","sub":"10.40.10.0/24 · 10.40.11.0/24 · No Public IPs","parent":"vpc-prod","kind":"subnet","icon":"aws/group-private-subnet","layout":{"order":1,"arrange":"column"},"appliances":[{"name":"sg-app","label":"SG: App Tier","sub":"443 from the ALB SG Only","type":"firewall","edge":"left","filters":"both","serves":["snet-public"],"info":"Security group on the instances: inbound 443 from the ALB security group only; no inbound 22."}]},{"name":"snet-data","label":"Isolated Subnets: Data","sub":"10.40.20.0/24 · 10.40.21.0/24 · No Internet Route","parent":"vpc-prod","kind":"subnet","icon":"aws/group-private-subnet","layout":{"order":2,"arrange":"column"},"appliances":[{"name":"sg-db","label":"SG: Database","sub":"5432 from the App SG Only","type":"firewall","edge":"left","filters":"inbound","serves":["snet-app"],"info":"Security group on the RDS instance: inbound 5432 from the application security group only."}]},{"name":"aws-services","label":"AWS Regional Services","sub":"Secrets Manager · S3 · CloudWatch · Systems Manager","parent":"aws-account","kind":"provider","color":"slate","icon":"aws/group-aws-cloud","layout":{"row":1,"arrange":"row"},"info":"Regional AWS services the application uses. The VPC reaches them through interface and gateway endpoints, never over the Internet.","appliances":[{"name":"vpce","label":"VPC Endpoints","sub":"PrivateLink · Endpoint Policies","type":"gateway","edge":"top","filters":"both","serves":["vpc-prod"],"icon":"aws/vpc-endpoints","info":"Interface endpoints for Secrets Manager, Systems Manager and CloudWatch, a gateway endpoint for S3; endpoint policies limit the S3 endpoint to buckets in this account."}]}],"nodes":[{"name":"customer","layout":{"order":0},"label":"Customer","sub":"Browser · Any Device","type":"remote-user","zone":"internet","info":"A shopper on the public Internet."},{"name":"cognito","layout":{"order":1},"label":"Cognito User Pool","sub":"Customer Identities · MFA · Risk Policies","type":"identity-provider","zone":"internet","icon":"aws/cognito","cloud":{"provider":"aws","service":"Amazon Cognito","exposure":"internet","endpoint":"public"},"info":"Holds customer identities; advanced security mode scores sign-ins and requires MFA on risk."},{"name":"cloudfront","layout":{"order":2},"label":"CloudFront + AWS WAF","sub":"Edge · TLS 1.2+ · Managed Rules · Rate Limit","type":"public-endpoint","zone":"internet","cloud":{"provider":"aws","service":"Amazon CloudFront","card":"aws-cloudfront","exposure":"internet","endpoint":"public","disabled_protocols":["tls1.0","tls1.1","http"]},"info":"The only public entry point. AWS WAF with managed rule groups and a rate-based rule is attached to the distribution."},{"name":"attacker","layout":{"order":3},"label":"Internet Attacker","sub":"Scanning · Credential Stuffing · Injection","type":"bad-actor","zone":"internet","info":"Opportunistic attacker probing the public surface."},{"name":"identity-center","layout":{"order":4},"label":"IAM Identity Center","sub":"SSO · Permission Sets · FIDO2","type":"identity-provider","zone":"internet","icon":"aws/iam-identity-center","cloud":{"provider":"aws","service":"IAM Identity Center","exposure":"internet","endpoint":"public"},"info":"Workforce sign-in for operators; permission sets map to IAM roles in the account."},{"name":"operator","layout":{"order":5},"label":"Operations Engineer","sub":"Managed Laptop · FIDO2 Key","type":"admin","zone":"internet","info":"Administers instances through Session Manager; never holds long-lived access keys."},{"name":"alb","label":"Application Load Balancer","sub":"Internet-Facing · TLS · Origin Header Rule","type":"service","zone":"snet-public","cloud":{"provider":"aws","service":"Application Load Balancer","card":"aws-alb","exposure":"internet","endpoint":"public","disabled_protocols":["tls1.0","tls1.1"]},"layout":{"order":0},"info":"Public listener on 443; its security group admits only the CloudFront managed prefix list, and a listener rule requires the origin secret header."},{"name":"nat","label":"NAT Gateway","sub":"Egress Only · Package Updates","type":"connector","zone":"snet-public","icon":"aws/vpc-nat-gateway","cloud":{"provider":"aws","service":"NAT Gateway","exposure":"private","endpoint":"none"},"layout":{"order":1},"info":"Outbound Internet access for the private subnets. Nothing filters what leaves."},{"name":"web-asg","label":"Web/App Tier","sub":"EC2 Auto Scaling · 2 AZs · IMDSv2","type":"host","zone":"snet-app","cloud":{"provider":"aws","service":"Amazon EC2","card":"aws-ec2","exposure":"private","endpoint":"private","disabled_protocols":["public-ip","ssh-from-internet","imdsv1"]},"info":"Amazon Linux instances in an Auto Scaling group across two AZs. No public IPs; IMDSv2 required; the SSM agent connects outbound.","components":[{"name":"web","label":"Web Front End","type":"web-server","ports":["443/tcp"],"info":"Serves the storefront; validates Cognito tokens."},{"name":"api","label":"Orders API","type":"api","ports":["443/tcp"],"info":"Reads and writes orders; calls RDS, Secrets Manager and S3 with the instance role."}],"depends_on":[{"kind":"secrets","ref":"secrets","note":"Database credentials and the API key, read by the instance role"},{"kind":"logging","ref":"cloudwatch","criticality":"degraded"},{"kind":"update-service","ref":"ssm","note":"SSM Agent: Session Manager and Patch Manager"}]},{"name":"rds","label":"Amazon RDS (PostgreSQL)","sub":"Multi-AZ · KMS Encryption · IAM Auth","type":"database","zone":"snet-data","cloud":{"provider":"aws","service":"Amazon RDS","card":"aws-rds","exposure":"private","endpoint":"private","disabled_protocols":["public-access","plaintext"]},"data_classification":"restricted","data_tags":["pii","financial"],"info":"Orders and customer records. Not publicly accessible; isolated subnets have no route to the Internet.","depends_on":[{"kind":"kms","label":"AWS KMS customer managed key","note":"Storage encryption; the instance cannot start without the key"}]},{"name":"s3-assets","label":"S3: Static Assets and Uploads","sub":"Block Public Access · OAC · SSE-KMS","type":"storage","zone":"aws-services","cloud":{"provider":"aws","service":"Amazon S3","card":"aws-s3","exposure":"private","endpoint":"private","disabled_protocols":["public-acls","http"]},"data_classification":"confidential","data_tags":["pii"],"layout":{"order":0},"info":"One bucket for the storefront assets CloudFront serves and the documents customers upload."},{"name":"secrets","label":"Secrets Manager + KMS","sub":"DB Credentials · API Keys · CMK","type":"service","zone":"aws-services","cloud":{"provider":"aws","service":"AWS Secrets Manager","card":"aws-secrets-kms","exposure":"private","endpoint":"private"},"data_classification":"restricted","data_tags":["credentials"],"layout":{"order":1},"info":"Rotated database credentials and third-party API keys, encrypted with a customer-managed KMS key."},{"name":"cloudwatch","label":"CloudWatch + CloudTrail","sub":"Logs · Alarms · Org Trail · GuardDuty","type":"service","zone":"aws-services","icon":"aws/cloudwatch","cloud":{"provider":"aws","service":"Amazon CloudWatch","exposure":"private","endpoint":"private"},"layout":{"order":2},"info":"Application and session logs, the organization CloudTrail trail and GuardDuty findings, with alarms to the on-call rotation."},{"name":"ssm","label":"Systems Manager","sub":"Session Manager · Patch Manager","type":"service","zone":"aws-services","icon":"aws/systems-manager","cloud":{"provider":"aws","service":"AWS Systems Manager","exposure":"private","endpoint":"private"},"layout":{"order":3},"info":"Brokers operator sessions to the instances and schedules patching; the agent on each instance connects outbound."}],"flows":[{"name":"f-customer-cognito","label":"Sign-In","from":"customer","to":"cognito","kind":"auth","auth":"cognito-oidc","protocol":"HTTPS","port":"443/tcp","encrypted":true,"data_classification":"restricted","data_tags":["credentials"],"info":"Hosted sign-in with MFA; the browser receives ID and access tokens."},{"name":"f-customer-cf","label":"Storefront","from":"customer","to":"cloudfront","kind":"data","auth":"cognito-oidc","protocol":"HTTPS","port":"443/tcp","encrypted":true,"data_classification":"restricted","data_tags":["pii"],"info":"Every request carries the Cognito access token; TLS terminates at the edge."},{"name":"f-cf-alb","label":"Origin Request","from":"cloudfront","to":"alb","kind":"data","auth":"origin-secret","protocol":"HTTPS","port":"443/tcp","encrypted":true,"data_classification":"restricted","data_tags":["pii"],"info":"CloudFront reaches the load balancer over TLS with the origin secret header; the ALB security group admits only the CloudFront prefix list."},{"name":"f-alb-we ","label":"Direct to ALB","from":"attacker","to":"alb","kind":"blocked","auth":"anonymous","blocked_reason":"The ALB security group admits only the CloudFront managed prefix list; direct requests never reach a listener"},{"name":"f-attacker-s3","label":"Public Bucket Access","from":"attacker","to":"s3-assets","kind":"blocked","auth":"anonymous","blocked_reason":"Block Public Access at the account level; the bucket policy admits only the CloudFront distribution and the instance role"}],"phases":[{"name":"connect","label":"Connect"},{"name":"identity","label":"Identity"},{"name":"access","label":"Access"},{"name":"operate","label":"Operate"}],"steps":[{"name":"request","phase":"connect","short":"Request","title":"A customer reaches the application at the edge","description":"The customer's browser resolves the storefront name to CloudFront. AWS WAF inspects the request against managed rule groups and a rate-based rule before anything reaches AnyCompany's account; TLS 1.2 or later is required.","flows":["f-customer-cf"],"highlight":["customer","cloudfront"],"packets":[{"flow":"f-customer-cf"}],"details":["One public entry point for the whole application","WAF managed rules and rate limiting at the edge","TLS terminates at CloudFront"]},{"name":"edge-origin","phase":"connect","short":"Origin","title":"CloudFront forwards to the load balancer with its origin secret","description":"The distribution reaches the Application Load Balancer over TLS. The ALB security group admits only the CloudFront managed prefix list, and a listener rule drops any request without the origin secret header, so the load balancer cannot be reached directly.","flows":["f-cf-alb"],"highlight":["cloudfront","alb"],"packets":[{"flow":"f-cf-alb"}],"details":["Security group: CloudFront prefix list only","Listener rule: origin secret header required"],"threats":["THR-0002"]},{"name":"signin","phase":"identity","short":"Sign-In","title":"The customer signs in through Cognito","description":"Hosted sign-in with MFA issues OIDC tokens; the storefront carries the access token on every request and the web tier validates it against the user pool.","flows":["f-customer-cognito","f-customer-cf"],"highlight":["customer","cognito"],"packets":[{"flow":"f-customer-cognito"},{"flow":"f-customer-cf"}],"details":["MFA enforced; advanced security mode scores sign-ins","Tokens validated by the web tier"],"threats":["THR-0001"]},{"name":"web-tier","phase":"access","short":"Web Tier","title":"The load balancer hands the request to the web tier in private subnets","description":"Instances in an Auto Scaling group across two AZs serve the storefront and the Orders API. They have no public IPs; the app security group admits only the load balancer; IMDSv2 is required on every instance.","flows":["f-alb-web","f-web-api"],"highlight":["alb","web-asg"],"packets":[{"flow":"f-alb-web"},{"flow":"f-web-api"}],"details":["No public IPs, no inbound SSH","IMDSv2 with hop limit 1"],"threats":["THR-0003"]},{"name":"data","phase":"access","short":"Data","title":"The API reaches RDS and Secrets Manager with its instance role","description":"IAM authentication tokens open the database connection over TLS; third-party keys come from Secrets Manager through the interface endpoint. No password sits in the application configuration.","flows":["f-api-rds","f-api-secrets"],"highlight":["web-asg","rds","secrets"],"packets":[{"flow":"f-api-rds"},{"flow":"f-api-secrets"}],"details":["IAM database authentication; TLS required","Secrets rotated by Secrets Manager","All of it over private endpoints"],"threats":["THR-0005"]},{"name":"assets","phase":"access","short":"Assets","title":"Static assets come from S3 through CloudFront; uploads go to the same bucket","description":"CloudFront fetches assets with origin access control; the API writes customer uploads through the S3 gateway endpoint. Block Public Access is on at the account level and the bucket policy names only the distribution and the instance role.","flows":["f-cf-s3","f-api-s3"],"highlight":["cloudfront","s3-assets"],"packets":[{"flow":"f-cf-s3"},{"flow":"f-api-s3"}],"details":["Origin access control, no public bucket","SSE-KMS on every object"],"threats":["THR-0004"]},{"name":"operate","phase":"operate","short":"Operate","title":"Instances log to CloudWatch and update through the NAT gateway","description":"Logs and metrics leave through the CloudWatch interface endpoint; package updates and anything without an endpoint leave through the NAT gateway, which filters nothing.","flows":["f-web-cloudwatch","f-web-nat"],"highlight":["web-asg","cloudwatch","nat"],"packets":[{"flow":"f-web-cloudwatch"},{"flow":"f-web-nat"}],"details":["GuardDuty watches flow logs and CloudTrail","Egress through NAT is unrestricted"],"threats":["THR-0006"]},{"name":"admin","phase":"operate","short":"Admin","title":"An operator opens a Session Manager session; no inbound port","description":"The operator signs in to IAM Identity Center with a FIDO2 key and starts a session from the console. Systems Manager relays it to the agent on the instance over its outbound connection; the session transcript goes to CloudWatch.","flows":["f-operator-sso","f-operator-ssm","f-web-ssm"],"highlight":["operator","identity-center","ssm","web-asg"],"packets":[{"flow":"f-operator-sso"},{"flow":"f-operator-ssm"},{"flow":"f-web-ssm"}],"details":["Phishing-resistant sign-in","No bastion, no inbound 22","Sessions logged"]},{"name":"denied","phase":"operate","short":"Denied","title":"What the attacker cannot do","description":"Direct requests to the load balancer and public reads of the bucket are refused before any application code runs; the instances have no public IP and no inbound SSH, and RDS is not publicly accessible, so there is nothing to connect to.","flows":["f-attacker-alb","f-attacker-s3"],"highlight":["attacker","web-asg","rds"],"packets":[{"flow":"f-attacker-alb","kind":"blocked"},{"flow":"f-attacker-s3","kind":"blocked"}],"details":["ALB: CloudFront prefix list only","Instances: no public IP, no 22","RDS: not publicly accessible","S3: Block Public Access"],"outcome":"The public surface is the CloudFront distribution and nothing else."}],"threats":[{"id":"THR-0001","number":1,"title":"Credential Stuffing and MFA Fatigue Against the Cognito User Pool","description":"Password lists from other breaches replayed against hosted sign-in; push-style MFA prompts accepted by tired customers.","status":"mitigated","classification":{"stride":["spoofing"],"attack_tactics":["TA0006","TA0001"]},"vulnerability":{"category":"broken-authentication","cwe":"CWE-307"},"targets":[{"kind":"flow","ref":"f-customer-cognito"},{"kind":"node","ref":"cognito","marker":false}],"boundary_crossed":{"type":"internet","from":"internet","to":"internet"},"assets_at_risk":["Customer accounts","Order history"],"data_classification":"restricted","data_tags":["pii","credentials"],"adversary":{"type":"automated-bot","source_class":"individual-outsider","motivation":["personal-gain"],"capability":"low","resources":"club","position":"external","required_privileges":"none","access_vector":"network","authentication_required":false,"actor_node":"attacker"},"attack":{"scenario":"Automated sign-in attempts from rotating IP ranges; successful pairs are resold or used to place fraudulent orders.","mitre_attack":["T1110.004","T1621"]},"risk":{"method":"likelihood-impact","likelihood":"high","impact":"high","rationale":"Hosted sign-in is public and lists are cheap; a taken-over account exposes PII and payment references.","consequence":"An attacker holds a valid customer session and can read and change that customer's orders.","residual":{"method":"likelihood-impact","likelihood":"low","impact":"high","rationale":"MFA with advanced security (CTL-0001) stops matched passwords; the WAF rate-based rule (CTL-0002) throttles the campaign.","rating":"low","score":2},"rating":"high","score":8},"standards":{"cwe":["CWE-307"],"owasp":["A07:2025"],"nist_800_53":["IA-2(1)","AC-7"],"cis_controls":["CIS-6.3"]},"treatment":{"decision":"mitigate","controls":["CTL-0001","CTL-0002"],"current_controls":["CTL-0001","CTL-0002"]},"provenance":{"discovered_by":"workshop","created":"2026-11-01","updated":"2026-11-01","notes":"Illustrative example for the reference architecture."},"layers":["illustrative-threats"]},{"id":"THR-0002","number":2,"title":"Direct Requests to the Load Balancer Bypass CloudFront and the WAF","description":"If the ALB accepted traffic from anywhere, an attacker who found its public name could skip the WAF, the rate limit and the edge TLS policy.","status":"mitigated","classification":{"stride":["tampering","elevation-of-privilege"],"attack_tactics":["TA0001"]},"vulnerability":{"category":"security-misconfiguration","cwe":"CWE-284"},"targets":[{"kind":"node","ref":"alb"},{"kind":"flow","ref":"f-attacker-alb","marker":false}],"boundary_crossed":{"type":"internet","from":"internet","to":"snet-public"},"assets_at_risk":["Web tier","WAF protections"],"data_classification":"restricted","data_tags":["pii"],"adversary":{"type":"hacker","source_class":"individual-outsider","motivation":["personal-gain"],"capability":"moderate","resources":"individual","position":"external","required_privileges":"none","access_vector":"network","authentication_required":false,"actor_node":"attacker"},"attack":{"scenario":"Certificate transparency logs or DNS history reveal the ALB name; the attacker sends injection payloads to it directly.","mitre_attack":["T1190","T1595.002"]},"risk":{"method":"likelihood-impact","likelihood":"moderate","impact":"high","rationale":"Load balancer names are discoverable; without the gate every WAF rule is moot.","consequence":"Injection and brute-force traffic reaches the application unfiltered.","residual":{"method":"likelihood-impact","likelihood":"very-low","impact":"high","rationale":"The security group admits only the CloudFront prefix list (CTL-0003) and the listener requires the origin secret (CTL-0004) pen every service the role can call.","consequence":"The attacker calls AWS APIs as the instance role from anywhere.","residual":{"method":"likelihood-impact","likelihood":"very-low","impact":"very-high","rationale":"IMDSv2 with hop limit 1 (CTL-0005) makes the metadata service unreachable through a forwarded request; AWS Config flags any instance without it.","rating":"low","score":2},"rating":"high","score":8},"standards":{"cwe":["CWE-918"],"owasp":["A10:2025"],"nist_800_53":["SI-10","AC-6"],"cis_controls":["CIS-16.10"]},"treatment":{"decision":"mitigate","controls":["CTL-0005"],"current_controls":["CTL-0005"]},"provenance":{"discovered_by":"workshop","created":"2026-11-01","updated":"2026-11-01","notes":"Illustrative example for the reference architecture."},"layers":["illustrative-threats"]},{"id":"THR-0004","number":4,"title":"Bucket Misconfiguration Exposes Customer Uploads to the Internet","description":"A bucket policy or ACL added during a support case could make the uploads prefix readable by anyone, as happened in many published breaches.","status":"mitigated","classification":{"stride":["information-disclosure"],"attack_tactics":["TA0009"]},"vulnerability":{"category":"security-misconfiguration","cwe":"CWE-284"},"targets":[{"kind":"node","ref":"s3-assets"},{"kind":"flow","ref":"f-attacker-s3","marker":false}],"boundary_crossed":{"type":"internet","from":"internet","to":"aws-services"},"assets_at_risk":["Customer documents"],"data_classification":"confidential","data_tags":["pii"],"adversary":{"type":"automated-bot","source_class":"individual-outsider","motivation":["personal-gain"],"capability":"low","resources":"individual","position":"external","required_privileges":"none","access_vector":"network","authentication_required":false,"actor_node":"attacker"},"attack":{"scenario":"Bucket-name scanners find the bucket within hours of a public grant and copy everything listable.","mitre_attack":["T1530"]},"risk":{"method":"likelihood-impact","likelihood":"low","impact":"high","rationale":"Account-level Block Public Access makes the grant impossible rather than merely unlikely.","consequence":"Customer documents readable by anyone with the URL.","residual":{"method":"likelihood-impact","likelihood":"very-low","impact":"high","rationale":"Block Public Access is enforced by the account and an SCP; the bucket policy admits only the distribution and the role (CTL-0006).","rating":"low","score":2},"rating":"low","score":2},"standards":{"cwe":["CWE-284"],"owasp":["A02:2025"],"nist_800_53":["AC-3","SC-7"],"cis_controls":["CIS-3.3"]},"treatment":{"decision":"mitigate","controls":["CTL-0006"],"current_controls":["CTL-0006"]},"provenance":{"discovered_by":"workshop","created":"2026-11-01","updated":"2026-11-01","notes":"Illustrative example for the reference architecture."},"layers":["illustrative-threats"]},{"id":"THR-0005","number":5,"title":"Over-Broad Instance Role Reads Every Secret and Opens the Database as Its Master User","description":"The instance role carries secretsmanager:GetSecretValue on every secret in the account and the role-based database user is also the master user. Any code running on the instance, legitimate or not, inherits the lot.","status":"open","classification":{"stride":["elevation-of-privilege","information-disclosure"],"attack_tactics":["TA0006","TA0009"]},"vulnerability":{"category":"privilege-escalation","cwe":"CWE-250"},"targets":[{"kind":"node","ref":"secrets"},{"kind":"node","ref":"rds","marker":false},{"kind":"node","ref":"web-asg","marker":false},{"kind":"flow","ref":"f-api-secrets","marker":false}],"boundary_crossed":{"type":"vpc-vnet","from":"snet-app","to":"aws-services"},"assets_at_risk":["Database master credentials","Third-party API keys","Orders database"],"data_classification":"restricted","data_tags":["credentials","pii","financial"],"adversary":{"type":"hacker","source_class":"individual-outsider","motivation":["personal-gain"],"capability":"moderate","resources":"individual","position":"external","required_privileges":"none","access_vector":"network","authentication_required":false,"actor_node":"attacker"},"attack":{"scenario":"Code running on the instance, through SSRF or a compromised dependency, lists and reads every secret and connects to the database as the master user.","mitre_attack":["T1552.001","T1078.004","T1005"]},"risk":{"method":"likelihood-impact","likelihood":"moderate","impact":"very-high","rationale":"The permission is one wildcard away from least privilege and every foothold on the instance becomes full data access.","consequence":"Any compromise of the web tier is a compromise of the whole data layer.","residual":{"method":"likelihood-impact","likelihood":"moderate","impact":"very-high","rationale":"GuardDuty and CloudTrail (CTL-0007) see unusual GetSecretValue calls after the fact; nothing prevents them.","rating":"high","score":8},"projected":{"method":"likelihood-impact","likelihood":"low","impact":"high","rationale":"Per-secret resource policies and a least-privilege role (CTL-0008) limit the role to the two secrets it needs and a non-master database user.","rating":"low","score":2},"rating":"high","score":8},"standards":{"cwe":["CWE-250","CWE-732"],"owasp":["A01:2025"],"nist_800_53":["AC-6","AC-6(1)"],"cis_controls":["CIS-3.3","CIS-6.8"]},"treatment":{"decision":"mitigate","controls":["CTL-0007","CTL-0008"],"current_controls":["CTL-0007"],"planned_controls":["CTL-0008"],"suggested_mitigations":[{"text":"Replace the role-based database user with a least-privilege application user and keep the master credential in Secrets Manager with no application access.","source":"reviewer","status":"suggested"}]},"provenance":{"discovered_by":"workshop","created":"2026-11-01","updated":"2026-11-01","notes":"Illustrative example for the reference architecture."},"layers":["illustrative-threats"]},{"id":"THR-0006","number":6,"title":"Unrestricted Egress Through the NAT Gateway Enables Exfiltration and Command-and-Control","description function animatePacket(pk,run,step){return new Promise(res=>{const g=EL.flow[pk.flow];const path=g&&g.querySelector('.line');if(!path||g.classList.contains('nb-hidden')){res();return;}const len=path.getTotalLength();const kind=pk.kind||(F[pk.flow]&&F[pk.flow].kind)||'data';const pg=el('g',{class:'packet packet-'+(kind==='tunnel'||kind==='trust'?'data':kind)});el('circle',{r:10,class:'halo'},pg);el('circle',{r:5,class:'core'},pg);const dur=(pk.duration_ms||1300)*(reduce?0.4:1);let start=null,added=false;const lit=kind==='blocked'?'lit-block':'lit';function frame(t){if(run!==ST.run){pg.remove();res();return;}if(!added){gPk.appendChild(pg);added=true;litCount[pk.flow]=(litCount[pk.flow]||0)+1;g.classList.add(lit);start=t;}const raw=Math.min(1,(t-start)/dur);const e=raw<.5?2*raw*raw:1-Math.pow(-2*raw+2,2)/2;const at=pk.direction==='reverse'?(1-e)*len:e*len;const p=path.getPointAtLength(at);pg.setAttribute('transform',`translate(${p.x.toFixed(1)},${p.y.toFixed(1)})`);if(raw<1)requestAnimationFrame(frame);else{pg.remove();litCount[pk.flow]=(litCount[pk.flow]||1)-1;if(litCount[pk.flow]<=0)g.classList.remove(lit);res();}}setTimeout(()=>{if(run!==ST.run){res();return;}requestAnimationFrame(frame);},pk.delay_ms||0);});}
function showBadge(ref){const b=boxOfRef(ref);if(!b)return;const g=el('g',{class:'badge',transform:`translate(${b.x+b.w-6},${b.y+6})`},gBadges);el('circle',{r:11},g);el('path',{d:'M-5,0.5 L-1.5,4 L5,-4'},g);}
// attack path hops: while a path is being walked, every hop carries a numbered red marker (on its flow, else at the box it lands on), the
// current hop is ringed, the chain's flows are drawn red; clicking a marker jumps to that hop
function hopSpot(s){if(s.flows&&s.flows.length){const r=routes.find(x=>x.f.name===s.flows[0]);if(r)return onLineSpot(r,14);}const b=s._to?boxOfRef(s._to):null;return b?{x:b.x+b.w-12,y:b.y+b.h}:null;}
function drawHops(p,cur){gHops.innerHTML='';const hs=PATH_STEPS.filter(s=>s._path===p);hs.forEach((s,i)=>{(s.flows||[]).forEach(n=>{const g=EL.flow[n];if(g)g.classList.add('chain');});const pos=hopSpot(s);if(!pos)return;const g=el('g',{class:'hop'+(i===cur?' cur':i<cur?' done':''),transform:`translate(${pos.x.toFixed(1)},${pos.y.toFixed(1)})`,tabindex:'0',role:'button'},gHops);el('circle',{r:11},g);const tx=el('text',null,g);tx.textContent=String(i+1);const hp=p.hops[i],t=THR[hp.threat];setTip(g,`${p.id} · Hop ${i+1} of ${hs.length}`,(t?t.title:hp.threat)+(hp.gain?' · gains '+(GAIN_LABEL[hp.gain]||hp.gain):''));g.addEventListener('click',e=>{e.stopPropagation();runStep(walk.indexOf(s));});});}
function finishVis(k){const step=walk[k];if(!step)return;(step.tunnel||[]).forEach(n=>{const g=EL.flow[n];if(g)g.classList.add('tunnel');});if(step.badge)showBadge(step.badge);renderPanel(step,k,true);ST.stepDone=true;}
async function runStep(k){if(!walk.length)return;k=Math.max(0,Math.min(walk.length-1,k));ST.idx=k;ST.stepDone=false;const run=++ST.run;const step=walk[k];clearTimeout(ST.timer);clearVis();if(step._path)drawHops(step._path,step._hop);(step.highlight||[]).forEach(r=>setActive(r,true));(step.flows||[]).forEach(n=>{const g=EL.flow[n];if(g)g.classList.add('step');});(step.threats||[]).forEach(id=>markers.filter(m=>m.t.id===id).forEach(m=>m.g.classList.add('step')));if(step.pulse){const g=EL.node[step.pulse]||EL.app[step.pulse];if(g)g.classList.add('pulse');}renderPanel(step,k,false);renderProgress();updateNav();if(step.packets&&step.packets.length){await Promise.all(step.packets.map(p=>animatePacket(p,run,step)));}else{await wait((reduce?150:650));}if(run!==ST.run)return;finishVis(k);loopStep(step,run);}
function loopStep(step,run){if(reduce||run!==ST.run||!step.packets||!step.packets.length)return;ST.timer=setTimeout(async function(){if(run!==ST.run)return;await Promise.all(step.packets.map(p=>animatePacket(p,run,step)));loopStep(step,run);},1100);}
const noSteps=!walk.length;$('#controls').querySelectorAll('#btn-restart,#btn-back,#btn-next').forEach(b=>b.hidden=noSteps);$('.info-progress').hidden=noSteps;

/* ===== 10b. go: draw this tab and hand its controls to the page ===== */
renderProgress();updateNav();zoom.reset(VB);
if(noSteps){renderPanel(null,0,false);$('#step-title').textContent='No walkthrough steps in this '+(TABS.length>1?'tab.':'model.');}else runStep(0);
// diagnostics: collisions are measured on the final points (after lane spreading), per route segment, against boxes the flow does not touch
const collisions=[],nearMisses=[];{const soft=obstacles.map(o=>inflate(o,7));routes.forEach(r=>{for(let i=0;i<r.points.length-1;i++){const a=r.points[i],b=r.points[i+1];if(a.bar&&b.bar)continue;const dx=Math.sign(b.x-a.x),dy=Math.sign(b.y-a.y);if(!dx&&!dy)continue;
  const A={x:a.x+(a.port?dx*11:0),y:a.y+(a.port?dy*11:0)},Bp={x:b.x-(b.port?dx*11:0),y:b.y-(b.port?dy*11:0)};if((Bp.x-A.x)*dx<0||(Bp.y-A.y)*dy<0)continue; // a stub only
  if(hits([A,Bp],obstacles))collisions.push(r.f.name+'#'+i);else if(!a.port&&!b.port&&hits([a,b],soft))nearMisses.push(r.f.name+'#'+i);}});}
window.__nb={model:M,tab:TAB.name,routes,markers,paths,VB,collisions,nearMisses,obstacles,LIFT,router:{XS,YS,nodeOk,edgeOk,INFL,DX,DY},vendorIcons:Object.keys(VENDOR_ICONS),missingIcons:[...MISSING_ICONS]};
return{ti:TI,ST,runStep,stepIndex:s=>{s=String(s);if(/^\d+$/.test(s))return +s>=1&&+s<=walk.length?+s-1:-1;return walk.findIndex(x=>x.name===s);},clearFocus,selectThreatById:id=>{const t=THR[id];if(t)selectThreat(t);},runPath:id=>{const p=paths.find(x=>x.id===id);if(p)selectPath(p,0);},refreshBands(){applyVisibility();},stop(){clearTimeout(ST.timer);ST.run++;gPk.innerHTML='';}};
}

/* ===== 11. zoom / pan: one module for the page; reset() takes the current tab's canvas size ===== */
const zoom=(function(){const wrap=$('#wrap'),lvl=$('#zoomlvl');const EPS=.5;let VB={w:1,h:1},MINW=1,view={x:0,y:0,w:1,h:1},anim=null;const rect=()=>svg.getBoundingClientRect();const zoomed=()=>view.w<VB.w-EPS;function clamp(v){v.w=Math.min(VB.w,Math.max(MINW,v.w));v.h=v.w*VB.h/VB.w;v.x=Math.min(Math.max(0,v.x),VB.w-v.w);v.y=Math.min(Math.max(0,v.y),VB.h-v.h);return v;}function apply(){svg.setAttribute('viewBox',`${view.x.toFixed(1)} ${view.y.toFixed(1)} ${view.w.toFixed(1)} ${view.h.toFixed(1)}`);const z=zoomed();wrap.classList.toggle('zoomed',z);$('#z-out').disabled=!z;$('#z-fit').disabled=!z;$('#z-in').disabled=view.w<=MINW+EPS;lvl.textContent=Math.round(VB.w/view.w*100)+'%';}function set(v){if(anim){cancelAnimationFrame(anim);anim=null;}view=clamp(v);apply();}function animateTo(t){if(anim)cancelAnimationFrame(anim);const f={...view},to=clamp(t),t0=performance.now(),dur=reduce?1:200;(function tick(ts){const k=Math.min(1,(ts-t0)/dur),e=1-Math.pow(1-k,3);view={x:f.x+(to.x-f.x)*e,y:f.y+(to.y-f.y)*e,w:f.w+(to.w-f.w)*e,h:f.h+(to.h-f.h)*e};apply();anim=k<1?requestAnimationFrame(tick):null;})(t0);}function zt(factor,cx,cy,base){const r=rect(),fx=(cx-r.left)/r.width,fy=(cy-r.top)/r.height;const nw=Math.min(VB.w,Math.max(MINW,base.w/factor)),nh=nw*VB.h/VB.w;return{x:base.x+fx*base.w-fx*nw,y:base.y+fy*base.h-fy*nh,w:nw,h:nh};}const zoomAt=(f,cx,cy)=>set(zt(f,cx,cy,view));const centerPt=()=>{const r=rect();return[r.left+r.width/2,r.top+r.height/2];};const fitAll=()=>animateTo({x:0,y:0,w:VB.w,h:VB.h});function stepZoom(f,cx,cy){if(cx===undefined)[cx,cy]=centerPt();if(f>1&&view.w<=MINW+EPS){fitAll();return;}animateTo(zt(f,cx,cy,view));}$('#z-in').addEventListener('click',()=>stepZoom(1.6));$('#z-out').addEventListener('click',()=>stepZoom(1/1.6));$('#z-fit').addEventListener('click',fitAll);svg.addEventListener('wheel',e=>{if(!(e.ctrlKey||e.metaKey))return;e.preventDefault();const dy=e.deltaMode===1?e.deltaY*16:e.deltaMode===2?e.deltaY*120:e.deltaY;zoomAt(Math.exp(-dy*.0035),e.clientX,e.clientY);},{passive:false});svg.addEventListener('dblclick',e=>{e.preventDefault();stepZoom(2,e.clientX,e.clientY);});let drag=null;window.__swallow=false;svg.addEventListener('pointerdown',e=>{if(e.pointerType==='touch'||e.button!==0||!zoomed())return;drag={id:e.pointerId,sx:e.clientX,sy:e.clientY,v0:{...view},moved:false};});svg.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;const dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;if(!drag.moved){if(Math.hypot(dx,dy)<4)return;drag.moved=true;svg.setPointerCapture(e.pointerId);wrap.classList.add('dragging');}const r=rect(),v=drag.v0;set({x:v.x-dx/r.width*v.w,y:v.y-dy/r.height*v.h,w:v.w,h:v.h});});function end(e){if(!drag||e.pointerId!==drag.id)return;window.__swallow=drag.moved;drag=null;wrap.classList.remove('dragging');setTimeout(()=>{window.__swallow=false;},0);}svg.addEventListener('pointerup',end);svg.addEventListener('pointercancel',end);return{reset(vb){if(anim){cancelAnimationFrame(anim);anim=null;}VB=vb;MINW=VB.w/6;view={x:0,y:0,w:VB.w,h:VB.h};apply();}};})();

/* ===== 12. start: tab strip, then the tab named in the URL hash (or the first), then the step or attack-path hop the hash asks for.
   Deep links: #tab=<name> · &step=<n | step name> (n counts the story's steps, then the hops) · &path=AP-nnnn[&hop=n] · &sections=all | none | <names> (which register sections show:
   threats, paths, requirements, coverage). Once the page
   has settled on a tab the hash is rewritten to the tab alone ===== */
TABS.forEach((t,i)=>{const b=h('button',{title:t.scenario?'What-if scenario: '+t.scenario.change:(t.description||t.label),type:'button',role:'tab',class:t.register?'reg':''},t.scenario?h('i',{class:'wi',text:'What-If'}):null,t.label);b.addEventListener('click',()=>showTab(i));tabsEl.appendChild(b);});tabsEl.classList.toggle('show',TABS.length>1);
const HASH0=location.hash||'';const hashPart=k=>decodeURIComponent(((HASH0.match(new RegExp('[#&]'+k+'=([^&]+)'))||[])[1]||''));
function openDeepLink(){const p=hashPart('path'),s=hashPart('step');const i=p?CUR.stepIndex(p+'-hop-'+(+(hashPart('hop')||1))):s?CUR.stepIndex(s):-1;if(i>=0)CUR.runStep(i);}
showTab(Math.max(0,TABS.findIndex(t=>t.name===hashPart('tab'))));openDeepLink();
/* ===== 13. self-check: the geometry report scripts/check.mjs reads. window.__nbTabs.check() in the console returns it for every diagram
   tab; opening the page with ?nbcheck=1 appends it to the body as a script element of type application/json with the id nb-report ===== */
function checkTab(){const nb=window.__nb;if(!nb||!nb.routes)return null;const R=nb.routes;const vis=el=>!el.closest('.nb-hidden');
  const texts=[...svg.querySelectorAll('text')].filter(t=>vis(t)&&t.getClientRects().length&&!t.closest('.tm')&&!t.closest('.ab')).map(t=>({t:t.textContent,r:t.getBoundingClientRect()}));
  const textOverlaps=[];for(let i=0;i<texts.length;i++)for(let j=i+1;j<texts.length;j++){const a=texts[i].r,b=texts[j].r;if(a.left<b.right-2&&a.right>b.left+2&&a.top<b.bottom-2&&a.bottom>b.top+2)textOverlaps.push(texts[i].t+' / '+texts[j].t);}
  const mm=svg.getScreenCTM();const lines=[...svg.querySelectorAll('.flow .line')].filter(vis);const lineOverText=new Set();
  if(mm)texts.forEach(tx=>lines.forEach(l=>{const len=l.getTotalLength();for(let d=0;d<len;d+=3){const p=l.getPointAtLength(d);const sx=p.x*mm.a+mm.e,sy=p.y*mm.d+mm.f;if(sx>tx.r.left+1&&sx<tx.r.right-1&&sy>tx.r.top+1&&sy<tx.r.bottom-1){lineOverText.add(l.closest('.flow').id+' over "'+tx.t+'"');break;}}}));
  const dist=(p,a,b)=>{const dx=b.x-a.x,dy=b.y-a.y,L2=dx*dx+dy*dy;let t=L2?((p.x-a.x)*dx+(p.y-a.y)*dy)/L2:0;t=Math.max(0,Math.min(1,t));return Math.hypot(p.x-(a.x+t*dx),p.y-(a.y+t*dy));};
  const glyphsNear=new Set();[...svg.querySelectorAll('.cb, .tm[data-threat], #g-fbadges .ab, .cancel')].forEach(g=>{const m=/translate\(([-\d.]+),([-\d.]+)\)/.exec(g.getAttribute('transform')||'');if(!m)return;const p={x:+m[1],y:+m[2]};const own=(g.closest('.flow')||{}).id||g.dataset.flow||((g.dataset.ref||'').startsWith('flow:')?g.dataset.ref.slice(5):'');
    R.forEach(rt=>{if('flow-'+rt.f.name===own||rt.f.name===own)return;if(g.dataset.threat&&nb.markers.some(mk=>mk.g===g&&mk.target.kind==='flow'&&mk.target.ref===rt.f.name))return;for(let i=0;i<rt.points.length-1;i++)if(dist(p,rt.points[i],rt.points[i+1])<11){glyphsNear.add((g.dataset.ref||g.dataset.threat||g.dataset.flow||'glyph')+' near '+rt.f.name);break;}});});
  const segs=R.flatMap(r=>{const o=[];for(let i=0;i<r.points.length-1;i++)o.push([r.points[i],r.points[i+1],r.f.name]);return o;});let crossings=0;const shared=[];
  for(let i=0;i<segs.length;i++)for(let j=i+1;j<segs.length;j++){const[a,b,fa]=segs[i],[c,e,fb]=segs[j];if(fa===fb)continue;const hA=Math.abs(a.y-b.y)<.5,hB=Math.abs(c.y-e.y)<.5;
    if(hA!==hB){const H=hA?[a,b]:[c,e],V=hA?[c,e]:[a,b];const y=H[0].y,x=V[0].x;if(x>Math.min(H[0].x,H[1].x)+.5&&x<Math.max(H[0].x,H[1].x)-.5&&y>Math.min(V[0].y,V[1].y)+.5&&y<Math.max(V[0].y,V[1].y)-.5)crossings++;}
    else{const k=hA?'x':'y',o=hA?'y':'x';if(Math.abs(a[o]-c[o])<.5){const lo=Math.max(Math.min(a[k],b[k]),Math.min(c[k],e[k])),hi=Math.min(Math.max(a[k],b[k]),Math.max(c[k],e[k]));if(hi-lo>1)shared.push(fa+' ~ '+fb+': '+Math.round(hi-lo)+' px');}}}
  const col=(a,b,c)=>(Math.abs(a.x-b.x)<.5&&Math.abs(b.x-c.x)<.5)||(Math.abs(a.y-b.y)<.5&&Math.abs(b.y-c.y)<.5);const bends={},jogs=[];let maxBends=0;
  R.forEach(r=>{const p=r.points;let n=0;for(let i=1;i<p.length-1;i++)if(!col(p[i-1],p[i],p[i+1]))n++;bends[r.f.name]=n;maxBends=Math.max(maxBends,n);
    for(let i=1;i<p.length-2;i++){const L=Math.abs(p[i].x-p[i+1].x)+Math.abs(p[i].y-p[i+1].y);if(L<20&&!col(p[i-1],p[i],p[i+1])&&!col(p[i],p[i+1],p[i+2]))jogs.push(r.f.name+': '+Math.round(L)+' px');}});
  return{tab:nb.tab,missingIcons:(nb.missingIcons||[]).slice(),collisions:nb.collisions.slice(),nearMisses:nb.nearMisses.slice(),fallback:R.filter(r=>r.fallback).map(r=>r.f.name),lineOverText:[...lineOverText],textOverlaps,glyphsNear:[...glyphsNear],jogs,sharedStretches:shared,crossings,maxBends,bends,canvas:{w:Math.round(nb.VB.w),h:Math.round(nb.VB.h)}};}
const HARD_CHECKS=['collisions','nearMisses','fallback','lineOverText','textOverlaps','glyphsNear','jogs','sharedStretches'];
function checkAll(){const start=CUR.ti;const out={renderer:RENDERER_VERSION,title:document.title,tabs:[]};TABS.forEach((t,i)=>{if(t.register)return;showTab(i);const rep=checkTab();if(rep)out.tabs.push(rep);});showTab(start);out.ok=out.tabs.every(r=>HARD_CHECKS.every(k=>!r[k].length));return out;}
window.__nbTabs={names:TABS.map(t=>t.name),show:showTab,current:()=>CUR.ti,check:checkAll,hardChecks:HARD_CHECKS};
// rep.page is the document's natural size (width, height) with the deep-linked step shown, refreshed once the walkthrough has settled:
// scripts/screenshot.mjs sizes its window from it so a picture holds the whole page at the diagram's natural scale
if(/[?&#]nbcheck(=|&|$)/.test(location.search+location.hash)){const rep=checkAll();openDeepLink();const pageSize=()=>({w:Math.max(document.documentElement.scrollWidth,document.body.scrollWidth),h:Math.max(document.documentElement.scrollHeight,document.body.scrollHeight)});rep.page=pageSize();window.__nbReport=rep;const el=document.createElement('script');el.type='application/json';el.id='nb-report';const put=()=>{el.textContent=JSON.stringify(rep).replace(/</g,'\\u003c');};put();document.body.appendChild(el);setTimeout(()=>{rep.page=pageSize();put();},1500);}
})();
</script>

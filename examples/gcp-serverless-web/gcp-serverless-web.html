/* svg: zones, appliances, nodes */
.zone .zbox{fill:color-mix(in srgb,var(--zc,#1F5FFF) 4%,#fff);stroke:var(--zc,#1F5FFF);stroke-opacity:.55;stroke-width:1.4}
.zone.dashed .zbox{stroke-dasharray:6 5}
.zone.oos .zbox{stroke-dasharray:3 4;fill:#fafbfc}
.zone .zlabel{fill:var(--zc,#1F5FFF);font:700 12px var(--sans);cursor:pointer}.zone .zsub{fill:var(--ink-3);font:11px var(--sans)}
.zone .ic{fill:none;stroke:var(--zc);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.zone.focus .zbox{stroke-width:2.4;stroke-opacity:1;filter:drop-shadow(0 4px 12px color-mix(in srgb,var(--zc) 45%,transparent))}
.seam{stroke:var(--rule-2);stroke-width:1.5;stroke-dasharray:2 6}
.seam-label{fill:var(--ink-3);font:600 12px var(--sans);letter-spacing:.04em;text-transform:uppercase}
.node,.app{cursor:pointer}
.node .box,.app .box{fill:var(--white);stroke:var(--nc,#B9C4D4);stroke-width:1.6;transition:stroke .25s,fill .25s}
.node:hover .box,.app:hover .box{stroke:var(--ink-2)}
.node.active .box,.app.active .box{stroke:var(--nc,#1F5FFF);stroke-width:2.6;fill:color-mix(in srgb,var(--nc,#1F5FFF) 8%,#fff)}
/* selection: a soft shadow in the element's own colour plus a firmer stroke */
.node.focus .box,.app.focus .box{stroke:var(--nc);stroke-width:2.4;filter:drop-shadow(0 3px 7px color-mix(in srgb,var(--nc) 60%,transparent))}
.comp.focus rect.cbox{stroke:var(--nc);stroke-opacity:1;stroke-width:1.8;filter:drop-shadow(0 2px 5px color-mix(in srgb,var(--nc) 55%,transparent))}
.node.oos .box,.app.oos .box{stroke-dasharray:4 4;opacity:.75}.node.oos text,.app.oos text,.comp.oos text{fill:var(--ink-3)}.node.oos .ic,.app.oos .ic,.comp.oos .ic{stroke:var(--grey)}.node.oos .accent,.app.oos .accent{fill:var(--grey)}
.comp.oos rect.cbox{stroke-dasharray:3 3;opacity:.7}
.flow.oos .line{opacity:.4}.flow.oos .fl{opacity:.5}
.flow.plain .line{stroke-dasharray:2 4}
.node.suggested .box,.app.suggested .box,.zone.suggested .zbox{stroke-dasharray:2 3}
.node .box.stack{fill:#F4F7FB;stroke:var(--nc);stroke-opacity:.5}
.node .t,.app .t{fill:var(--ink);font:600 12px var(--sans)}.node .s,.app .s{fill:var(--ink-3);font:11px var(--sans)}
.node .accent,.app .accent{fill:var(--nc,#1F5FFF)}
.node .ic,.app .ic,.comp .ic{fill:none;stroke:var(--nc,#1F5FFF);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.node.hostile .ic{stroke:var(--block)}
.vic use{pointer-events:none}.node.oos .vic,.app.oos .vic,.comp.oos .vic,.zone.oos .vic{opacity:.45;filter:grayscale(1)}.node.hostile .accent{fill:var(--block)}
.node .ring{fill:none;stroke:var(--nc);stroke-width:2.4;opacity:0;transform-box:fill-box;transform-origin:center;pointer-events:none}
.node.pulse .ring{animation:ring 1.2s ease-out infinite}
@keyframes ring{0%{opacity:.75;transform:scale(1)}100%{opacity:0;transform:scale(1.08)}}
.comp rect.cbox{fill:#F7F9FC;stroke:var(--nc);stroke-opacity:.35;stroke-width:1.2}
.comp.active rect.cbox{stroke-opacity:1;stroke-width:2;fill:color-mix(in srgb,var(--nc) 10%,#fff)}
.comp .t{fill:var(--ink);font:600 11px var(--sans)}.comp .p{fill:var(--ink-3);font:10px var(--mono)}
.app .t{font-size:11.5px}
.tag-sugg{fill:var(--warn);font:700 9px var(--mono);letter-spacing:.06em}
.cls-tag{fill:var(--ink-3);font:700 8.5px var(--mono);letter-spacing:.06em}
/* flows */
.flow .line{fill:none;stroke:var(--fc,#B9C4D4);stroke-width:2;transition:stroke .3s,stroke-width .3s}
.flow .hit{fill:none;stroke:transparent;stroke-width:14;cursor:pointer}
.flow.lit .line{stroke-width:3}
.flow.tunnel .line{stroke:var(--k-tunnel);stroke-width:4;stroke-dasharray:9 6;animation:flow .9s linear infinite}
.flow.kind-blocked .line{stroke-dasharray:6 5}
.flow.kind-trust .line{stroke-dasharray:2 6;stroke-width:1.5}
.flow.kind-dependency .line{stroke-dasharray:3 5;stroke-width:1.4}
.flow.strength-weak .line,.flow.strength-none .line{stroke-dasharray:7 4}
.flow.lit-block .line{stroke:var(--block);stroke-width:2.6}
.flow.focus .line{stroke-width:3.4;filter:drop-shadow(0 2px 4px color-mix(in srgb,var(--fc) 70%,transparent))}
.flow.step .line{stroke-width:2.8}
.flow .fl{fill:var(--ink-3);font:600 10px var(--sans);paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round}
.cancel-bg{fill:var(--block);stroke:#fff;stroke-width:2}
.cancel-x{fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round}
@keyframes flow{to{stroke-dashoffset:-15}}
.ab circle.bg{fill:#fff;stroke:var(--ac);stroke-width:2}
.ab text{fill:var(--ac);font:800 10px var(--mono);text-anchor:middle;dominant-baseline:central}
.ab path{fill:none;stroke:var(--ac);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ab{cursor:help}
.packet .halo{opacity:.25}
.packet-control circle{fill:var(--k-control)}.packet-auth circle{fill:var(--k-auth)}.packet-token circle{fill:var(--k-token)}.packet-blocked circle{fill:var(--block)}.packet-data circle{fill:var(--k-data)}
.badge circle{stroke:#fff;stroke-width:2;fill:var(--pass)}.badge path{fill:none;stroke:#fff;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.badge{animation:fade .3s ease-out}@keyframes fade{from{opacity:0}to{opacity:1}}
/* threat markers */
.tm{cursor:pointer}
.tm circle.core{stroke:#fff;stroke-width:2}
.tm circle.pat{fill:none;stroke-width:1.6}
.tm text{font:800 11px var(--mono);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.tm.active circle.core,.tm.step circle.core{stroke:var(--ink);stroke-width:2.5}
.tm.step{filter:drop-shadow(0 0 4px rgba(20,33,61,.5))}
.tm.dim{opacity:.35}
/* attack paths: a red phase per path, numbered hop markers on the canvas, chips in the band, the register and the attributes card */
.phases li.attack{color:#8A1C14;border-color:#F3B4AE}.phases li.attack b{background:#FBE9E7;border-color:#F3B4AE;color:#8A1C14}
.phases li.attack.cur{background:#FBE9E7;border-color:var(--block);color:#8A1C14}.phases li.attack.cur b,.phases li.attack.done b{background:var(--block);border-color:var(--block);color:#fff}
.flow.chain .line{stroke:var(--block);stroke-width:2.6}
.hop circle{fill:var(--block);stroke:#fff;stroke-width:2}.hop text{fill:#fff;font:700 11px var(--mono);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.hop.cur circle{stroke:var(--ink);stroke-width:2.5}.hop.cur{filter:drop-shadow(0 0 4px rgba(209,53,44,.6))}.hop.done circle{fill:#8A1C14}.hop{cursor:pointer;outline:none}
.gainchip{display:inline-flex;align-items:center;gap:6px;border:1px solid #F3B4AE;border-radius:999px;padding:2px 9px;font-size:11px;color:#8A1C14;background:#FBE9E7;font-weight:700}
.pchip{display:inline-flex;align-items:center;gap:6px;border:1px solid #F3B4AE;border-radius:999px;padding:2px 9px 2px 3px;font-size:11px;cursor:pointer;background:#fff;color:var(--ink-2)}.pchip:hover{border-color:var(--block)}
.pchip i{display:grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--block);color:#fff;font:700 10px var(--mono);font-style:normal}
ol.hops{margin:0;padding:0;list-style:none}ol.hops li{margin:4px 0;line-height:1.5}ol.hops li .desc{margin-left:0}
.tabs button i.wi{font-style:normal;font:700 9px var(--mono);letter-spacing:.06em;color:#B45309;border:1px solid #F0C27A;border-radius:3px;padding:0 4px;margin-right:6px;background:#FFF7E6;vertical-align:1px}
.regpage h3.rsec{margin:18px 16px 6px;font:700 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.whatif{display:flex;align-items:center;gap:10px;margin:6px 0 4px;padding:6px 10px;border:1px solid #F0C27A;border-left:4px solid #B45309;border-radius:6px;background:#FFF7E6;font-size:11.5px;color:var(--ink-2)}
.whatif b{color:#B45309;font:700 10px var(--mono);letter-spacing:.06em;white-space:nowrap}.whatif a{color:var(--brand);cursor:pointer;text-decoration:underline;white-space:nowrap;margin-left:auto}
.tm .tchk path.sh{fill:var(--pass);stroke:#fff;stroke-width:1.4;stroke-linejoin:round}.tm .tchk path.chk{fill:none;stroke:#fff;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tip .st{display:inline-block;font-weight:700;border-radius:4px;padding:0 6px;line-height:1.5;margin:2px 0}
.tip .st-open{color:#5a3e00;background:#FFF1C2;border:1px solid #E0A100}
.tip .st-mitigated{color:#fff;background:var(--pass)}
.tip .st-in-progress{color:#fff;background:var(--brand)}
.tip .st-accepted,.tip .st-transferred{color:var(--ink);background:var(--paper);border:1px solid var(--rule-2)}
.tip .st-retired,.tip .st-false-positive,.tip .st-duplicate{color:var(--ink-3);background:var(--paper);border:1px solid var(--rule);text-decoration:line-through}
.tip .ok{color:var(--pass);font-weight:700}
.cb{cursor:help}.cb path{fill:var(--pass);stroke:var(--pass);stroke-width:1.2;stroke-linejoin:round}.cb path.chk{fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round}
@media(prefers-reduced-motion:reduce){.flow.tunnel .line,.node.pulse .ring,.badge{animation:none}.flow.tunnel .line{stroke-dasharray:none}}
</style>

<script id="nb-model" type="application/json">{"$schema":"../../skills/netblueprint-forge/assets/schema/netblueprint.schema.json","netblueprint":"1","meta":{"title":"Cymbal Shop on Google Cloud: Serverless Web Application with Cloud Run","subtitle":"Reference Architecture","description":"Customers reach Cloud Run services through a global external HTTPS load balancer with Cloud Armor and Cloud CDN. The services reach Cloud SQL and Memorystore on private IPs through a Serverless VPC Access connector, keep credentials in Secret Manager, serve static assets from Cloud Storage, and expose an admin console only through Identity-Aware Proxy. Adapted from the Google Cloud Architecture Center's guidance for serverless web applications, set at Google's sample organization Cymbal.","author":"DigitalPrez, LLC","organization":"Cymbal","date":"2026-11-01","version":"1.0.0","revision_note":"First version. Renderer 1.8.0.","document_classification":"internal","document_id":"NBF-EX-0005","status":"draft","objective":"Run the storefront without servers to manage, with every data store on a private IP, every credential in Secret Manager and every administrative page behind Identity-Aware Proxy.","flow_summary":"Customer to the storefront; API to Cloud SQL, Memorystore and Secret Manager; SRE to the admin console through IAP","path_summary":["Customer","Cloud Armor + LB","Cloud Run","VPC Connector","Cloud SQL"],"access_summary":"Customers: Identity Platform with MFA (OIDC). SREs: Cloud Identity with a security key, then IAP. Services: per-service accounts, ID tokens between services, no key files.","assumptions":["One production project with Org Policy constraints applied at the folder","Cloud Run ingress is restricted to the load balancer and the VPC","Cloud SQL and Memorystore have private IPs only, through Private Service Access"],"out_of_scope":["The Cloud Build pipeline that builds and deploys the images","BigQuery analytics fed from Cloud SQL exports"],"tags":["gcp","serverless","cloud-run","reference-architecture"]},"settings":{"network_label":"Cymbal: Google Cloud Production Project","internet_label":"Internet","layout":{"min_width":1280,"min_height":640,"flow_direction":"left-to-right"},"show":{"threats":true,"threat_register":true,"layer_panel":true,"signature_block":true,"legend":true}},"auth_types":[{"id":"idp-oidc","label":"Identity Platform + MFA (OIDC)","strength":"strong","description":"Customer sign-in through Identity Platform with MFA; the storefront receives OIDC tokens."},{"id":"lb-ingress","label":"Ingress: Load Balancer Only","strength":"moderate","description":"Cloud Run accepts requests only from the load balancer and the VPC; the request carries no caller identity of its own."},{"id":"run-id-token","label":"Service Account ID Token","strength":"strong","description":"Service-to-service calls carry a Google-signed ID token; the callee's IAM policy admits only the caller's service account."},{"id":"sa-iam","label":"Service Account (IAM)","strength":"strong","description":"The workload identity of the Cloud Run service; no key file anywhere."},{"id":"sql-iam","label":"Cloud SQL IAM Authentication + TLS","strength":"strong","description":"Database sign-in with the service account over TLS; no database password in the application."},{"id":"redis-auth","label":"Memorystore AUTH String","strength":"weak","description":"A shared AUTH string in the service's configuration; no identity, no rotation."},{"id":"signed-url","label":"Signed URL","strength":"moderate","description":"Time-limited signed URLs for uploads, minted by the storefront with its service account."},{"id":"google-sso","label":"Cloud Identity + Security Key","strength":"strong","phishing_resistant":true,"description":"Workforce sign-in with a FIDO2 security key enforced by Cloud Identity."},{"id":"iap-oidc","label":"Identity-Aware Proxy (OIDC)","strength":"strong","phishing_resistant":true,"description":"IAP checks the identity, the access level and the device before the request reaches the service."},{"id":"iap-jwt","label":"IAP-Signed JWT","strength":"strong","description":"The admin service verifies the signed IAP header on every request, so a bypass of the proxy carries no valid identity."},{"id":"anonymous","label":"Anonymous","strength":"none"}],"layers":[{"name":"illustrative-threats","label":"Illustrative Threats","description":"Example threats and controls. Hide to see the plain design.","visible":true}],"zones":[{"name":"gcp-project","label":"Google Cloud Project: Cymbal-Shop-Prod","sub":"us-central1 · Org Policy · Audit Logs","kind":"cloud","color":"teal","icon":"gcp/project","layout":{"order":0,"arrange":"column"},"info":"One production project under the Cymbal organization. Org Policy enforces public access prevention, uniform bucket-level access and domain-restricted sharing."},{"name":"serverless","label":"Cloud Run (Managed)","sub":"Regional · Ingress: Load Balancer and VPC · Min Instances","parent":"gcp-project","kind":"provider","color":"blue","icon":"gcp/cloud-run","layout":{"row":0,"arrange":"row"},"info":"Fully managed Cloud Run services; each runs as its own service account and reaches the VPC through the connector."},{"name":"vpc-prod","label":"Production VPC","sub":"10.60.0.0/16 · Private Google Access · Cloud NAT","parent":"gcp-project","kind":"vpc","color":"blue","icon":"gcp/virtual-private-cloud","layout":{"row":1,"order":0,"arrange":"row"},"info":"Holds the connector subnet and the Private Service Access range for Cloud SQL and Memorystore. No workload has a public IP.","appliances":[{"name":"fw-rules","label":"VPC Firewall","sub":"Connector Range to 5432/6379 Only","type":"firewall","edge":"top","filters":"inbound","serves":["serverless"],"icon":"gcp/cloud-firewall-rules","info":"Firewall rules admit the connector range to the database and cache ports; everything else is denied by the implied rule."}]},{"name":"snet-connector","label":"Connector Subnet","sub":"10.60.1.0/28","parent":"vpc-prod","kind":"subnet","layout":{"order":0,"arrange":"column"},"info":"Dedicated /28 for the Serverless VPC Access connector instances."},{"name":"snet-services","label":"Private Services Range","sub":"10.60.16.0/20 · Private Service Access","parent":"vpc-prod","kind":"subnet","layout":{"order":1,"arrange":"column"},"info":"Google-managed range peered into the VPC; Cloud SQL and Memorystore answer here on private IPs only."},{"name":"gcp-services","label":"Google Cloud APIs","sub":"IAP · Secret Manager · Logging · Cloud Storage","parent":"gcp-project","kind":"provider","color":"slate","icon":"gcp/cloud-apis","layout":{"row":1,"order":1,"arrange":"column"},"info":"Regional Google APIs the services call with their service accounts over Private Google Access; a VPC Service Controls perimeter around the project keeps the data from leaving it.","appliances":[{"name":"vpc-sc","label":"VPC Service Controls","sub":"Perimeter: Project Only","type":"zero-trust-broker","edge":"top","filters":"both","serves":["serverless","vpc-prod"],"icon":"gcp/category-security-identity","info":"A service perimeter around the project: Secret Manager and Cloud Storage API calls from outside the perimeter are denied even with valid credentials."}]}],"nodes":[{"name":"customer","layout":{"order":0},"label":"Customer","sub":"Browser · Any Device","type":"remote-user","zone":"internet","info":"A shopper on the public Internet."},{"name":"identity-platform","layout":{"order":1},"label":"Identity Platform","sub":"Customer Identities · MFA · OIDC","type":"identity-provider","zone":"internet","icon":"gcp/identity-platform","cloud":{"provider":"gcp","service":"Identity Platform","exposure":"internet","endpoint":"public"},"info":"Customer identities with MFA and reCAPTCHA Enterprise on sign-in."},{"name":"ext-lb","layout":{"order":2},"label":"External HTTPS Load Balancer","sub":"Global · Cloud Armor · Cloud CDN · Managed TLS","type":"public-endpoint","zone":"internet","cloud":{"provider":"gcp","service":"External HTTP(S) Load Balancer","card":"gcp-external-lb-cloud-armor","exposure":"internet","endpoint":"public","disabled_protocols":["tls1.0","tls1.1","http"]},"info":"The only public entry point. Cloud Armor applies preconfigured WAF rules and a rate limit; Cloud CDN serves the static assets."},{"name":"attacker","layout":{"order":3},"label":"Internet Attacker","sub":"Scanning · Credential Stuffing · Injection","type":"bad-actor","zone":"internet","info":"Opportunistic attacker probing the public surface."},{"name":"google-identity","layout":{"order":4},"label":"Cloud Identity","sub":"Workforce · Security Keys · Context-Aware Access","type":"identity-provider","zone":"internet","icon":"gcp/identity-and-access-management","cloud":{"provider":"gcp","service":"Cloud Identity","exposure":"internet","endpoint":"public"},"info":"Workforce identities for the SRE team; security keys required."},{"name":"sre","layout":{"order":5},"label":"Site Reliability Engineer","sub":"Managed Device · Security Key","type":"admin","zone":"internet","info":"Operates the storefront through the admin console behind IAP and the Cloud Console; holds no service account keys."},{"name":"iap","layout":{"order":0},"label":"Identity-Aware Proxy","sub":"OIDC · Access Levels · Security Keys","type":"service","zone":"gcp-services","cloud":{"provider":"gcp","service":"Identity-Aware Proxy","card":"gcp-iap","exposure":"internet","endpoint":"public"},"info":"Fronts the admin console: identity, access level and device checks before the request is forwarded with a signed header."},{"name":"run-web","label":"Storefront (Cloud Run)","sub":"Ingress: LB Only · Service Account · Min 2","type":"service","zone":"serverless","cloud":{"provider":"gcp","service":"Cloud Run","card":"gcp-cloud-run","exposure":"internet","endpoint":"public","disabled_protocols":["run-url-public","unauthenticated-invocation"]},"layout":{"order":0},"info":"Renders the storefront and validates Identity Platform tokens. Ingress allows only the load balancer and the VPC; the run.app URL answers 403.","depends_on":[{"kind":"api","ref":"run-api","note":"Pages render from the Orders API"}]},{"name":"run-api","label":"Orders API (Cloud Run)","sub":"Ingress: Internal · ID Tokens · VPC Egress","type":"service","zone":"serverless","cloud":{"provider":"gcp","service":"Cloud Run","card":"gcp-cloud-run","exposure":"private","endpoint":"private","disabled_protocols":["unauthenticated-invocation"]},"layout":{"order":1},"info":"Reads and writes orders; invoked only with an ID token from the storefront or the admin console; reaches the VPC through the connector.","depends_on":[{"kind":"secrets","ref":"secret-manager","note":"Database password and the API signing key, read at start-up with the service account"},{"kind":"logging","ref":"logging","criticality":"degraded"},{"kind":"network","ref":"vpc-connector","note":"Every private call to Cloud SQL and Memorystore rides the Serverless VPC Access connector"}]},{"name":"run-admin","label":"Admin Console (Cloud Run)","sub":"Ingress: LB Only · Behind IAP","type":"service","zone":"serverless","cloud":{"provider":"gcp","service":"Cloud Run","card":"gcp-cloud-run","exposure":"private","endpoint":"private","disabled_protocols":["unauthenticated-invocation"]},"layout":{"order":2},"info":"Order management for the SRE and support teams; every request arrives through IAP and carries its signed header.","depends_on":[{"kind":"identity","ref":"iap","note":"IAP fronts every administrative request"}]},{"name":"vpc-connector","label":"Serverless VPC Access Connector","sub":"e2-micro × 2–10 · Egress to the VPC","type":"connector","zone":"snet-connector","cloud":{"provider":"gcp","service":"Serverless VPC Access","exposure":"private","endpoint":"none"},"info":"Google-managed connector instances that carry Cloud Run egress into the VPC."},{"name":"cloud-sql","label":"Cloud SQL (PostgreSQL)","sub":"Private IP · CMEK · IAM Auth · HA","type":"database","zone":"snet-services","cloud":{"provider":"gcp","service":"Cloud SQL","card":"gcp-cloud-sql","exposure":"private","endpoint":"private","disabled_protocols":["public-ip","plaintext"]},"data_classification":"restricted","data_tags":["pii","financial"],"layout":{"order":0},"info":"Orders and customer records. Private IP only, no authorized networks, customer-managed encryption key."},{"name":"memorystore","label":"Memorystore (Redis)","sub":"Private IP · AUTH · In-Transit Encryption","type":"database","zone":"snet-services","cloud":{"provider":"gcp","service":"Memorystore for Redis","card":"gcp-memorystore","exposure":"private","endpoint":"private"},"data_classification":"confidential","data_tags":["pii"],"layout":{"order":1},"info":"Session and catalogue cache. Reachable by any workload in the VPC that holds the AUTH string."},{"name":"secret-manager","label":"Secret Manager + Cloud KMS","sub":"DB Credentials · API Keys · CMEK","type":"service","zone":"gcp-services","cloud":{"provider":"gcp","service":"Secret Manager","card":"gcp-secret-manager-kms","exposure":"private","endpoint":"private"},"data_classification":"restricted","data_tags":["credentials"],"layout":{"order":1},"info":"Third-party API keys and the Redis AUTH string, with versions and audit logs; keys in Cloud KMS."},{"name":"gcs-assets","label":"Cloud Storage: Assets and Uploads","sub":"Public Access Prevention · Uniform Access · CMEK","type":"storage","zone":"gcp-services","cloud":{"provider":"gcp","service":"Cloud Storage","card":"gcp-cloud-storage","exposure":"private","endpoint":"private","disabled_protocols":["public-access","legacy-acls"]},"data_classification":"confidential","data_tags":["pii"],"layout":{"order":3},"info":"One bucket for storefront assets, served through the load balancer and Cloud CDN, and the documents customers upload with signed URLs."},{"name":"logging","label":"Cloud Logging + Monitoring","sub":"Audit Logs · Alerts · Security Command Center","type":"service","zone":"gcp-services","icon":"gcp/cloud-logging","cloud":{"provider":"gcp","service":"Cloud Logging","exposure":"private","endpoint":"private"},"layout":{"order":2},"info":"Request, audit and data-access logs with alerting; Security Command Center findings go to the SRE on-call."}],"flows":[{"name":"f-customer-idp","label":"Sign-In","from":"customer","to":"identity-platform","kind":"auth","auth":"idp-oidc","protocol":"HTTPS","port":"443/tcp","encrypted":true,"data_classification":"restricted","data_tags":["credentials"],"info":"Identity Platform sign-in with MFA and reCAPTCHA Enterprise; the browser receives OIDC tokens."},{"name":"f-customer-lb","label":"Storefront","from":"customer","to":"ext-lb","kind":"data","auth":"idp-oidc","protocol":"HTTPS","port":"443/tcp","encrypted":true,"data_classification":"restricted","data_tags":["pii"],"info":"Every request carries the Identity Platform token; Cloud Armor inspects it first."},{"name":"f-lb-web","label":"Serverless NEG","from":"ext-lb","to":"run-web","kind":"data","auth":"lb-ingress","protocol":"HTTPS","port":"443/tcp","encrypted":true,"data_classification":"restricted","data_tags":["pii"],"via":[],"info":"The load balancer forwards to the storefront through a serverless network endpoint group; ingress settings refuse any other source."},{"name":"f-web-api","label":"Orders Calls","from":"run-web","to":"run-api","kind":"data","auth":"run-id-token","protocol":"HTTPS","port":"443/tcp","encrypted":true,"data_classification":"restricted","data_tags":["pii"],"info":"The storefront's service account presents an ID token; the API's IAM policy admits only that account."},{"name":"f-api-connector","label":"VPC Access","from":"run-api","to":"vpc-connector","kind":"tunnel","auth":"sa-iam","protocol":"HTTPS","port":"443/tcp","encrypted":true,"data_classification":"internal","via":[],"info":"Private-range egress from the API goes through the connector into the VPC."},{"name":"f-connector-sql","label":"Orders Database","from":"vpc-connector","to":"cloud-sql","kind":"data","auth":"sql-iam","protocol":"PostgreSQL","port":"5432/tcp","encrypted":true,"data_classification":"restricted","data_tags":["pii","financial"],"info":"IAM database authentication over TLS on the private IP; the firewall admits only the connector range."},{"name":"f-connector-redis","label":"Cache","from":"vpc-connector","to":"memorystore","kind":"data","auth":"redis-auth","protocol":"Redis","port":"6379/tcp","encrypted":true,"data_classification":"confidential","data_tags":["pii"],"info":"Session and catalogue reads with the shared AUTH string over in-transit encryption."},{"name":"f-api-secrets","label":"Secrets","from":"run-api","to":"secret-manager","kind":"dependency","auth":"sa-iam","protocol":"HTTPS","port":"443/tcp","encrypted":true,"data_classification":"restricted","data_tags":["credentials"],"via":[],"info":"Reads API keys and the Redis AUTH string at start over Private Google Access, inside the perimeter."},{"name":"f-customer-gcs","label":"Uploads (Signed URLs)","from":"customer","to":"gcs-assets","kind":"data","auth":"signed-url","protocol":"HTTPS","port":"443/tcp","encrypted":true,"data_classification":"confidential","data_tags":["pii"],"via":[],"info":"The storefront mints short-lived signed URLs; the browser uploads documents straight to the bucket with them."},{"name":"f-lb-gcs","label":"Static Assets (Cloud CDN)","from":"ext-lb","to":"gcs-assets","kind":"data","auth":"anonymous","protocol":"HTTPS","port":"443/tcp","encrypted":true,"data_classification":"public","via":[],"info":"A backend bucket serves the storefront assets through Cloud CDN; only the assets prefix is readable by the load balancer."},{"name":"f-api-logging","label":"Logs and Metrics","from":"run-api","to":"logging","kind":"dependency","auth":"sa-iam","protocol":"HTTPS","port":"443/tcp","encrypted":true,"data_classification":"internal","via":[],"info":"Request and application logs from every service; data-access audit logs from Cloud SQL and Secret Manager."},{"name":"f-sre-sso","label":"SRE Sign-In","from":"sre","to":"google-identity","kind":"auth","auth":"google-sso","protocol":"HTTPS","port":"443/tcp","encrypted":true,"data_classification":"restricted","data_tags":["credentials"],"info":"Cloud Identity with a security key; context-aware access requires a managed device."},{"name":"f-sre-iap","label":"Admin Console via IAP","from":"sre","to":"iap","kind":"data","auth":"iap-oidc","protocol":"HTTPS","port":"443/tcp","encrypted":true,"data_classification":"restricted","data_tags":["pii"],"via":[],"info":"IAP checks identity, access level and device, then forwards with a signed header."},{"name":"f-iap-admin","label":"Forward with IAP JWT","from":"iap","to":"run-admin","kind":"data","auth":"iap-jwt","protocol":"HTTPS","port":"443/tcp","encrypted":true,"data_classification":"restricted","data_tags":["pii"],"via":[],"info":"The admin service verifies the IAP JWT on every request; nothing else may invoke it."},{"name":"f-admin-api","label":"Admin Operations","from":"run-admin","to":"run-api","kind":"data","auth":"run-id-token","protocol":"HTTPS","port":"443/tcp","encrypted":true,"data_classification":"restricted","data_tags":["pii","financial"],"info":"Refunds and order changes through the same API, with the admin console's service account."},{"name":"f-attacker-lb","label":"Credential Stuffing / Scanning","from":"attacker","to":"ext-lb","kind":"data","auth":"anonymous","protocol":"HTTPS","port":"443/tcp","encrypted":true,"data_classification":"public","info":"Automated traffic hits the only public endpoint; Cloud Armor rate limiting and WAF rules absorb most of it."},{"name":"f-attacker-api","label":"Direct to Run.app URL","from":"attacker","to":"run-api","kind":"blocked","auth":"anonymous","blocked_reason":"Ingress is internal; the run.app URL answers 403 to requests that do not come through the load balancer or the VPC"},{"name":"f-attacker-gcs","label":"Public Bucket Access","from":"attacker","to":"gcs-assets","kind":"blocked","auth":"anonymous","blocked_reason":"Public access prevention is enforced by Org Policy; uniform bucket-level access, no legacy ACLs"}],"phases":[{"name":"connect","label":"Connect"},{"name":"identity","label":"Identity"},{"name":"access","label":"Access"},{"name":"operate","label":"Operate"}],"steps":[{"name":"request","phase":"connect","short":"Request","title":"A customer reaches the storefront through the global load balancer","description":"The customer's browser resolves the storefront name to the load balancer's anycast IP. Cloud Armor applies preconfigured WAF rules and a rate limit before anything reaches a Cloud Run service; static assets come from Cloud CDN.","flows":["f-customer-lb"],"highlight":["customer","ext-lb"],"packets":[{"flow":"f-customer-lb"}],"details":["One public entry point for the whole application","Cloud Armor WAF rules and rate limiting","Managed TLS certificates, TLS 1.2 or later"]},{"name":"signin","phase":"identity","short":"Sign-In","title":"The customer signs in through Identity Platform","description":"Identity Platform issues OIDC tokens after MFA; the storefront carries the token on every request and validates it.","flows":["f-customer-idp","f-customer-lb"],"highlight":["customer","identity-platform"],"packets":[{"flow":"f-customer-idp"},{"flow":"f-customer-lb"}],"details":["MFA and reCAPTCHA Enterprise on sign-in","Tokens validated by the storefront service"],"threats":["THR-0001"]},{"name":"storefront","phase":"access","short":"Storefront","title":"The load balancer forwards to the storefront service","description":"A serverless network endpoint group routes to the storefront on Cloud Run. Ingress is restricted to the load balancer and the VPC, so the run.app URL answers 403 to anyone else.","flows":["f-lb-web"],"highlight":["ext-lb","run-web"],"packets":[{"flow":"f-lb-web"}],"details":["Ingress: internal and Cloud Load Balancing","No unauthenticated invocation"],"threats":["THR-0002"]},{"name":"orders","phase":"access","short":"Orders","title":"The storefront calls the Orders API, which reaches Cloud SQL through the VPC connector","description":"The storefront presents an ID token; the API, invoked only by that service account, reaches the database on its private IP through the Serverless VPC Access connector with IAM database authentication.","flows":["f-web-api","f-api-connector","f-connector-sql"],"highlight":["run-web","run-api","vpc-connector","cloud-sql"],"packets":[{"flow":"f-web-api"},{"flow":"f-api-connector"},{"flow":"f-connector-sql"}],"details":["ID tokens between services","Private IP, IAM authentication, TLS","Firewall: connector range only"],"threats":["THR-0003"]},{"name":"cache-secrets","phase":"access","short":"Cache","title":"The API reads the cache and its secrets","description":"Session and catalogue reads go to Memorystore with the shared AUTH string; API keys and the AUTH string itself come from Secret Manager inside the VPC Service Controls perimeter.","flows":["f-connector-redis","f-api-secrets"],"highlight":["run-api","memorystore","secret-manager"],"packets":[{"flow":"f-connector-redis"},{"flow":"f-api-secrets"}],"details":["Memorystore: AUTH string, in-transit encryption","Secret Manager inside the perimeter"],"threats":["THR-0004","THR-0005"]},{"name":"assets","phase":"access","short":"Assets","title":"Static assets come from Cloud Storage through Cloud CDN; uploads use signed URLs","description":"The load balancer serves the assets prefix from a backend bucket; the storefront mints signed URLs so customers upload documents straight to the bucket. Public access prevention is enforced by Org Policy.","flows":["f-lb-gcs","f-customer-gcs"],"highlight":["ext-lb","customer","gcs-assets"],"packets":[{"flow":"f-lb-gcs"},{"flow":"f-customer-gcs"}],"details":["Public access prevention, uniform bucket-level access","Customer-managed encryption key"],"threats":["THR-0006"]},{"name":"operate","phase":"operate","short":"Operate","title":"Every service logs to Cloud Logging; findings reach the on-call SRE","description":"Request logs, audit logs and data-access logs are collected with alerting; Security Command Center findings page the on-call rotation.","flows":["f-api-logging"],"highlight":["run-api","logging"],"packets":[{"flow":"f-api-logging"}],"details":["Data-access audit logs for Cloud SQL and Secret Manager","Security Command Center findings to on-call"]},{"name":"admin","phase":"operate","short":"Admin","title":"An SRE opens the admin console through Identity-Aware Proxy","description":"The SRE signs in to Cloud Identity with a security key; IAP checks the identity, the access level and the device, then forwards the request with a signed header that the admin service verifies. Changes go through the same Orders API.","flows":["f-sre-sso","f-sre-iap","f-iap-admin","f-admin-api"],"highlight":["sre","google-identity","iap","run-admin","run-api"],"packets":[{"flow":"f-sre-sso"},{"flow":"f-sre-iap"},{"flow":"f-iap-admin"},{"flow":"f-admin-api"}],"details":["Security key required","Context-aware access: managed devices only","IAP JWT verified in the service"]},{"name":"denied","phase":"operate","short":"Denied","title":"What the attacker cannot do","description":"Direct calls to the run.app URLs and public reads of the bucket are refused before any application code runs; the admin console answers only to IAP, and Cloud SQL and Memorystore have no public IP at all.","flows":["f-attacker-api","f-attacker-gcs"],"highlight":["attacker","run-admin","cloud-sql","memorystore"],"packets":[{"flow":"f-attacker-api","kind":"blocked"},{"flow":"f-attacker-gcs","kind":"blocked"}],"details":["Cloud Run: ingress restricted, no unauthenticated invocation","Admin console: IAP only","Cloud SQL and Memorystore: private IP only","Cloud Storage: public access prevention"],"outcome":"The public surface is the load balancer and nothing else."}],"threats":[{"id":"THR-0001","number":1,"title":"Credential Stuffing Against Identity Platform Sign-In","description":"Password lists replayed a scription":"Every Cloud Run service has a run.app URL. If ingress allowed all traffic, an attacker could reach the storefront and the API without passing the load balancer, Cloud Armor or the rate limit.","status":"mitigated","classification":{"stride":["tampering","elevation-of-privilege"],"attack_tactics":["TA0001"]},"vulnerability":{"category":"security-misconfiguration","cwe":"CWE-284"},"targets":[{"kind":"node","ref":"run-web"},{"kind":"node","ref":"run-api","marker":false},{"kind":"flow","ref":"f-attacker-api","marker":false}],"boundary_crossed":{"type":"internet","from":"internet","to":"serverless"},"assets_at_risk":["Storefront","Orders API"],"data_classification":"restricted","data_tags":["pii"],"adversary":{"type":"hacker","source_class":"individual-outsider","motivation":["personal-gain"],"capability":"moderate","resources":"individual","position":"external","required_privileges":"none","access_vector":"network","authentication_required":false,"actor_node":"attacker"},"attack":{"scenario":"The run.app URL is guessed or found in a client bundle; injection payloads go to it directly.","mitre_attack":["T1190","T1595.002"]},"risk":{"method":"likelihood-impact","likelihood":"moderate","impact":"high","rationale":"run.app URLs are predictable; without the ingress setting every Cloud Armor rule is moot.","consequence":"Injection and brute-force traffic reaches the services unfiltered.","residual":{"method":"likelihood-impact","likelihood":"very-low","impact":"high","rationale":"Ingress is internal-and-load-balancing and invocation requires IAM (CTL-0003); the URL answers 403.","rating":"low","score":2},"rating":"moderate","score":5},"standards":{"cwe":["CWE-284"],"owasp":["A02:2025"],"nist_800_53":["SC-7","AC-4"],"cis_controls":["CIS-12.2"]},"treatment":{"decision":"mitigate","controls":["CTL-0003"],"current_controls":["CTL-0003"]},"provenance":{"discovered_by":"workshop","created":"2026-11-01","updated":"2026-11-01","notes":"Illustrative example for the referen iew","by":"Security"}],"layers":["illustrative-threats"]},{"id":"CTL-0011","name":"Data-Access Audit Logs and Security Command Center Findings to the SRE On-Call","type":"detective","status":"verified","verification":"continuous-monitoring","verified_on":"2026-10-20","effectiveness":"moderate","owner":"Security operations","implemented_on":[{"kind":"node","ref":"logging"}],"nist_800_53":["AU-6","SI-4"],"cis_controls":["CIS-8.2"],"mitre_mitigations":["M1047"],"evidence":[{"kind":"log-sample","reference":"Data-access audit log entries and Security Command Center findings routed to the SRE on-call, sampled in the quarterly detection review","by":"SRE"}],"layers":["illustrative-threats"]},{"id":"CTL-0012","name":"Cloud SQL: Private IP Only, IAM Authentication, TLS Required, CMEK","type":"preventive","status":"verified","verification":"audit","verified_on":"2026-10-15","effectiveness":"very-high","owner":"Data team","implemented_on":[{"kind":"node","ref":"cloud-sql"}],"nist_800_53":["SC-8","SC-28","IA-2"],"cis_controls":["CIS-3.11"],"mitre_mitigations":["M1041","M1030"],"d3fend":["D3-MENCR"],"evidence":[{"kind":"configuration-export","reference":"gcloud sql instances describe for the orders instance","by":"SRE","note":"ipv4Enabled false, requireSsl true, CMEK key set, IAM authentication on"}],"layers":["illustrative-threats"]}],"requirements":[{"id":"REQ-0001","number":1,"title":"Customer Data Reachable Only Over Private IP","statement":"Cloud SQL and Memorystore have no public address; only the Serverless VPC Access connector range may reach their ports, over TLS with IAM authentication.","kind":"security","priority":"must","status":"verified","source":"architecture","threats":["THR-0004","THR-0005"],"controls":["CTL-0009","CTL-0012"],"frameworks":[{"framework":"nist-800-53-r5","clause":"SC-7"}],"owner":"SRE"},{"id":"REQ-0002","number":2,"title":"Only Attested Images Run in Production","statement":"Every Cloud Run revision is built by the pipeline, scanned by Artifact A   R.forEach(r=>{const p=r.points;let n=0;for(let i=1;i<p.length-1;i++)if(!col(p[i-1],p[i],p[i+1]))n++;bends[r.f.name]=n;maxBends=Math.max(maxBends,n);
    for(let i=1;i<p.length-2;i++){const L=Math.abs(p[i].x-p[i+1].x)+Math.abs(p[i].y-p[i+1].y);if(L<20&&!col(p[i-1],p[i],p[i+1])&&!col(p[i],p[i+1],p[i+2]))jogs.push(r.f.name+': '+Math.round(L)+' px');}});
  return{tab:nb.tab,missingIcons:(nb.missingIcons||[]).slice(),collisions:nb.collisions.slice(),nearMisses:nb.nearMisses.slice(),fallback:R.filter(r=>r.fallback).map(r=>r.f.name),lineOverText:[...lineOverText],textOverlaps,glyphsNear:[...glyphsNear],jogs,sharedStretches:shared,crossings,maxBends,bends,canvas:{w:Math.round(nb.VB.w),h:Math.round(nb.VB.h)}};}
const HARD_CHECKS=['collisions','nearMisses','fallback','lineOverText','textOverlaps','glyphsNear','jogs','sharedStretches'];
function checkAll(){const start=CUR.ti;const out={renderer:RENDERER_VERSION,title:document.title,tabs:[]};TABS.forEach((t,i)=>{if(t.register)return;showTab(i);const rep=checkTab();if(rep)out.tabs.push(rep);});showTab(start);out.ok=out.tabs.every(r=>HARD_CHECKS.every(k=>!r[k].length));return out;}
window.__nbTabs={names:TABS.map(t=>t.name),show:showTab,current:()=>CUR.ti,check:checkAll,hardChecks:HARD_CHECKS};
// rep.page is the document's natural size (width, height) with the deep-linked step shown, refreshed once the walkthrough has settled:
// scripts/screenshot.mjs sizes its window from it so a picture holds the whole page at the diagram's natural scale
if(/[?&#]nbcheck(=|&|$)/.test(location.search+location.hash)){const rep=checkAll();openDeepLink();const pageSize=()=>({w:Math.max(document.documentElement.scrollWidth,document.body.scrollWidth),h:Math.max(document.documentElement.scrollHeight,document.body.scrollHeight)});rep.page=pageSize();window.__nbReport=rep;const el=document.createElement('script');el.type='application/json';el.id='nb-report';const put=()=>{el.textContent=JSON.stringify(rep).replace(/</g,'\\u003c');};put();document.body.appendChild(el);setTimeout(()=>{rep.page=pageSize();put();},1500);}
})();

# NetBlueprint Forge checks: the validator suite, the schema check and the headless layout check,
# on every push and pull request to develop and master. No npm install: the scripts have no dependencies;
# the layout check needs a Chromium-based browser, which setup-chrome provides (v2 installs Chrome for Testing).
# The jobs run on a pinned image, ubuntu-24.04, not ubuntu-latest: the layout check measures text with the fonts the
# image substitutes for "Segoe UI", so the image moves on purpose, with a run of check_layout --font first, never by itself.
name: checks

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validator suite
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Fixtures and examples through validate.mjs
        run: node tests/check_validate.mjs
      - name: Vendor icon library, card icons and the examples' symbols
        run: node tests/check_icons.mjs

  schema:
    name: Schema check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install jsonschema
        run: python -m pip install --quiet jsonschema
      - name: Fixtures against the JSON Schema
        run: python -I tests/check_schema.py

  layout:
    name: Headless layout check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: browser-actions/setup-chrome@v2
        id: chrome
      - name: Build the examples and check every diagram tab
        # Hard checks only: the runner's fonts are not the ones the crossings/bends baseline was taken with,
        # so those two numbers are reported here and compared locally (node tests/check_layout.mjs).
        env:
          NB_BROWSER: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/check_layout.mjs --hard-only
      - name: Keep the rendered pages
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rendered-examples
          path: examples/*/*.html
          retention-days: 14
